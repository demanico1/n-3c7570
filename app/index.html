<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
  --good:#0f7b3f; --good-bg:#e7f6ec; --bad:#b3261e; --bad-bg:#fdeceb;
  --mid:#8a6d00; --mid-bg:#fdf6e0; --accent:#1c6fd0; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --card:#191c21; --line:#2a2f37; --ink:#e8eaed; --dim:#9aa2ad;
    --good:#5ddb97; --good-bg:#122a1c; --bad:#ff8b80; --bad-bg:#2c1614;
    --mid:#e6c455; --mid-bg:#2a2412; --accent:#6fb0ff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --card:#191c21; --line:#2a2f37; --ink:#e8eaed; --dim:#9aa2ad;
  --good:#5ddb97; --good-bg:#122a1c; --bad:#ff8b80; --bad-bg:#2c1614;
  --mid:#e6c455; --mid-bg:#2a2412; --accent:#6fb0ff; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
i{font-style:normal}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",
       "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  overflow-wrap:anywhere;
}
button,input,select{font:inherit;color:inherit}

#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      padding:16px;background:var(--bg);z-index:50;visibility:hidden}
#wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:14px;background:var(--bg);z-index:49;color:var(--dim);
      font-size:13.5px}
#wait .dot{width:34px;height:34px;border-radius:17px;border:3px solid var(--line);
      border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#wait .dot{animation:none}}
#wait button{padding:10px 18px;border:0;border-radius:10px;background:var(--accent);
      color:#fff;font-weight:600;cursor:pointer}

#lock .box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
      border-radius:16px;padding:24px 20px;box-shadow:var(--shadow);text-align:center}
#lock h1{margin:0 0 4px;font-size:19px}
#lock p{margin:0 0 18px;color:var(--dim);font-size:13px}
#pw{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);text-align:center;letter-spacing:.1em}
#go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;
    background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
#go:disabled{opacity:.55}
#err{min-height:18px;margin-top:10px;color:var(--bad);font-size:13px}
.remember{margin-top:12px;color:var(--dim);font-size:13px;display:flex;
    align-items:center;justify-content:center;gap:6px}

header{position:sticky;top:0;z-index:20;background:var(--bg);
       padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#hdsp{display:none}
@media (max-width:719px){
  header{position:fixed;left:0;right:0;will-change:transform}
  #hdsp{display:block}
  header.up{box-shadow:0 2px 10px rgba(0,0,0,.08)}
}
#curtag{position:absolute;right:38px;max-width:52%;display:none;align-items:center;gap:5px;
  padding:4px 8px;border:0;border-radius:7px;background:var(--good-bg);color:var(--good);
  font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
#curtag .t{overflow:hidden;text-overflow:ellipsis}
#curtag i{font-style:normal;font-weight:400;opacity:.8}

.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;
 text-decoration:none;color:var(--ink);-webkit-tap-highlight-color:transparent}
.brand img{width:30px;height:24px;display:block;flex:0 0 30px}
.brand span{min-width:0;display:block;line-height:1.15}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.4px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);
 font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand:active{opacity:.6}
.top h1{margin:0;font-size:16px;font-weight:700;flex:1;min-width:0;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;
 padding:6px 9px;cursor:pointer;font-size:13px}
.iconbtn{display:inline-flex;align-items:center;gap:3px;padding:6px 7px}
#cartbtn.on{background:var(--bad-bg);border-color:var(--bad)}
#cartbtn.on em{color:var(--bad)}
.iconbtn em{font-style:normal;font-size:9px;font-weight:700;color:var(--dim);
 letter-spacing:-.5px;line-height:1;white-space:nowrap}
@media(max-width:400px){ #more em{display:none} }

.help{text-align:left;margin:4px 0 2px}
.help p{margin:0 0 11px;font-size:13px;line-height:1.65;color:var(--ink)}
.help p:last-child{margin-bottom:0}
.help b{font-weight:700}
@media(max-width:370px){
  .top{gap:5px}
  .brand{gap:6px}
  .brand img{width:26px;height:21px;flex:0 0 26px}
  .top .brand b{font-size:14.5px}
  .brand i{font-size:9.5px}
  .iconbtn{padding:5px 7px}
}
.searchwrap{position:relative;display:flex;align-items:center}
#q{width:100%;padding:9px 76px 9px 38px;border:1px solid var(--line);
   border-radius:12px;background:var(--card)}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mag{position:absolute;left:13px;color:var(--dim);pointer-events:none}
#hits{position:absolute;right:38px;color:var(--dim);font-size:12px;
      font-variant-numeric:tabular-nums;pointer-events:none}
#clr{position:absolute;right:8px;border:0;background:none;color:var(--dim);
     font-size:18px;cursor:pointer;padding:4px 6px;display:none}
.rows{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;
      padding-bottom:2px}
.rows::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border:1px solid var(--line);border-radius:999px;
      background:var(--card);color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#subchips{display:none;margin-top:7px}
#subchips.on{display:flex}
#subchips .sl{flex:none;align-self:center;font-size:12px;color:var(--dim);margin-right:1px}
.sc{flex:0 0 auto;padding:5px 10px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);
    font-size:12.5px;cursor:pointer;white-space:nowrap}
.sc i{font-style:normal;color:var(--dim);margin-left:3px;font-variant-numeric:tabular-nums}
.sc.on{background:var(--good-bg);color:var(--good);font-weight:700}
.sc.on i{color:var(--good)}
.sortbar{display:flex;gap:8px;padding:8px 12px 4px}
.sortbar .sb{flex:1;min-width:0;display:flex;align-items:center;
 justify-content:center;gap:3px;height:34px;padding:0 4px;
 background:var(--card);border:1px solid var(--line);border-radius:12px;
 color:var(--dim);font-size:12.5px;font-weight:600;letter-spacing:-.4px;
 cursor:pointer;white-space:nowrap;overflow:hidden;font-family:inherit;
 -webkit-tap-highlight-color:transparent}
.sortbar .sb.on{background:var(--accent);border-color:var(--accent);
 color:#fff;font-weight:700}
.sortbar .sb.on select{color:#fff}
.sortbar .sb.on::after{color:#fff;opacity:.85}
.sortbar select{border:0;background:transparent;color:inherit;font:inherit;
 font-size:12.5px;letter-spacing:-.4px;padding:0;cursor:pointer;min-width:0;
 max-width:100%;-webkit-appearance:none;appearance:none;
 text-align:center;text-align-last:center}
.sortbar select:focus{outline:none}
.sortbar select option{color:var(--ink);background:var(--card);font-weight:400}
.sortbar .selwrap::after{content:"▾";font-size:9px;color:var(--dim);
 pointer-events:none;flex:0 0 auto}

#addbar{display:flex;align-items:center;gap:10px;margin:10px 12px 0;
        padding:9px 10px 9px 9px;border-radius:12px;
        background:linear-gradient(135deg,#0e8a55,#0b7a4b);color:#fff;
        box-shadow:0 2px 10px rgba(11,122,75,.28)}
#addbar[hidden]{display:none}
#addbar img{width:38px;height:38px;border-radius:10px;flex:none;
            background:#fff;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.22)}
#addbar .ab-t{flex:1;min-width:0;line-height:1.35}
#addbar .ab-t b{display:block;font-size:13.5px}
#addbar .ab-t span{font-size:11.5px;opacity:.88}
#addgo{flex:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;
       cursor:pointer;background:#fff;border:0;color:#0b7a4b}
#addgo:active{opacity:.8}
#addno{flex:none;width:26px;height:26px;padding:0;border-radius:7px;cursor:pointer;
       background:rgba(255,255,255,.16);border:0;color:#fff;font-size:12px;line-height:1}
#addbar.calm{background:var(--card);color:var(--dim);border:1px solid var(--line);
       box-shadow:none;justify-content:space-between;padding:8px 10px}
#addbar.calm .ab-msg{font-size:12.5px}
#addbar.calm button{flex:none;font-size:12px;padding:6px 11px;border-radius:7px;
       cursor:pointer;background:var(--bg);border:1px solid var(--line);color:var(--dim)}

.sum{display:flex;gap:8px;padding:10px 12px 2px}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
         padding:9px 6px;text-align:center}
.sum b{display:block;font-size:16.5px;font-variant-numeric:tabular-nums;
       white-space:nowrap}
.sum span{font-size:11px;color:var(--dim)}

main{padding:10px 12px 28px;display:grid;gap:8px}
@media(min-width:720px){main{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){main{grid-template-columns:1fr 1fr 1fr}}
.item{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);
      border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.left{flex:0 0 68px}
.thumb{width:68px;height:68px;border-radius:10px;background:var(--bg);
       object-fit:contain;cursor:zoom-in}
.body{flex:1;min-width:0}
.nm{font-weight:600;line-height:1.35}
.nm mark{background:transparent;color:var(--accent);font-weight:700}
.sub{margin-top:2px;font-size:12px;color:var(--dim)}
.pr{display:flex;align-items:flex-end;gap:10px;margin-top:7px;flex-wrap:wrap}
.pr .g{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pr .c{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.side{margin-left:auto;text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:4px 9px;border-radius:9px;font-size:13px;
       font-weight:700;font-variant-numeric:tabular-nums}
.gap{display:block;margin-top:3px;font-size:12px;color:var(--dim);
       font-variant-numeric:tabular-nums}
.b-good{background:var(--good-bg);color:var(--good)}
.b-mid{background:var(--mid-bg);color:var(--mid)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-none{background:var(--bg);color:var(--dim);font-weight:600}
.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);
     border:1px solid var(--line);color:var(--dim)}
#onlybar{display:none;align-items:center;justify-content:space-between;gap:10px;
        margin:0 12px 10px;padding:10px 12px;border-radius:10px;
        background:var(--accent);color:#fff;font-size:13px}
#onlybar{flex-wrap:wrap}
#onlybar .ob{display:flex;gap:6px;flex-shrink:0}
#onlybar button{font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;
        background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:44px 12px}
.e-head{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:6px}
.e-sub{font-size:12.5px;line-height:1.7;margin-bottom:14px}
.e-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.e-go{font-size:12.5px;padding:8px 14px;border-radius:8px;cursor:pointer;
      background:var(--accent);border:1px solid var(--accent);color:#fff}
.e-go:active{opacity:.75}
#sheet .note.basis{margin-top:-6px;font-size:12px;color:var(--dim);line-height:1.5;word-break:keep-all}
footer{padding:18px 14px 34px;color:var(--dim);font-size:11.5px;text-align:center;line-height:1.7;word-break:keep-all}

#zoom{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;z-index:40;
      align-items:center;justify-content:center;padding:16px;flex-direction:column}
#zoom img{width:100%;max-width:440px;max-height:72vh;object-fit:contain;
      border-radius:14px;background:#fff;padding:10px}
#zoom p{margin:16px 0 0;text-align:center;color:#fff;font-size:14px;
        line-height:1.5;max-width:440px}
#zoom small{color:#b9bec6;font-size:12px;margin-top:8px}

#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:45;
       align-items:flex-end;justify-content:center;overscroll-behavior:contain}
#sheet .box{position:relative;width:100%;max-width:460px;background:var(--card);
       border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));
       border:1px solid var(--line);border-bottom:0;
       max-height:calc(100% - 24px);max-height:calc(100dvh - 24px);
       overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
html.sheet-on,html.sheet-on body{overflow:hidden;overscroll-behavior-y:none}
@media(min-width:520px){
  #sheet{align-items:center}
  #sheet .box{border-radius:18px;border-bottom:1px solid var(--line)}
}
#sheet h3{margin:0 0 3px;padding-right:34px;font-size:15px;line-height:1.4}
#sheet .x{position:absolute;top:9px;right:10px;padding:7px;line-height:0;
       cursor:pointer;user-select:none}
#sheet .x svg{width:17px;height:17px;display:block}
#sheet .x svg path{stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;
       fill:none;opacity:.75}
#sheet .x:hover svg path{opacity:1}
#sheet .note{margin:0 0 14px;color:var(--dim);font-size:12.5px}
#sheet .box.hbox{display:flex;flex-direction:column;overflow:hidden;padding:0;background:var(--bg);
     height:calc(100% - 24px);height:calc(100dvh - 24px)}
.hbox .hh{flex:none;background:var(--card);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#sheet .hbox .hh h3{margin:0 0 10px;font-size:18px}
.hchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hchips::-webkit-scrollbar{display:none}
#sheet .hchips button{flex:none;width:auto;margin:0;padding:6px 12px;border-radius:999px;
     border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--dim);gap:0}
#sheet .hchips button.on{background:#0b7a4b;border-color:#0b7a4b;color:#fff}
.hbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
     padding:0 12px calc(16px + env(safe-area-inset-bottom))}
.hsec{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;
     padding:14px;font-size:15px;line-height:1.55;color:var(--ink)}
.hsec b{font-weight:700}
.hst{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hst b{font-size:16.5px}
.hic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--good-bg);color:var(--good);
     display:flex;align-items:center;justify-content:center}
.hic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;
     stroke-linecap:round;stroke-linejoin:round}
.hmini{background:var(--bg);border-radius:12px;padding:10px;margin:2px 0 10px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px}
.hthumb{flex:none;width:46px;height:46px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hex{display:flex;gap:8px;align-items:flex-start;margin:7px 0}
.hn{flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;background:#0b7a4b;color:#fff;
     font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hflow{display:flex;align-items:center;gap:6px;margin:2px 0 10px}
.hstep{flex:1;min-width:0;background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;
     font-size:12px;color:var(--dim)}
.hstep .v{height:30px;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:3px;color:var(--ink)}
.harr{flex:none;color:var(--dim)}
.hbar{display:flex;align-items:center;justify-content:space-between;background:#0b7a4b;color:#fff;
     border-radius:12px 12px 0 0;padding:8px 12px;margin:2px 0 10px;line-height:1.35}
.hbar small{display:block;font-size:11px;opacity:.85}
.hbar .t{font-size:18px;font-weight:700}
.hbtns{display:flex;gap:5px;margin:2px 0 10px}
.hbtns span{flex:1;min-width:0;text-align:center;padding:7px 2px;border:1px solid var(--line);border-radius:8px;
     background:var(--card);font-size:12px;white-space:nowrap}
.hsearch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
     border-radius:10px;padding:8px 12px;font-size:15px}
.hsearch svg{width:16px;height:16px;fill:none;stroke:var(--dim);stroke-width:2.2;stroke-linecap:round}
.hpill{display:inline-block;padding:4px 10px;margin:6px 4px 0 0;border-radius:999px;border:1px solid var(--line);
     background:var(--card);font-size:12.5px}
.hpill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hmenu span{display:block;padding:9px 12px;margin-top:6px;border:1px solid var(--line);border-radius:10px;
     background:var(--card);font-size:13.5px}
.hmenu span.go{background:var(--accent);border-color:var(--accent);color:#fff}
.hnote{font-size:13px;color:var(--dim);margin-top:6px}
#sheet .hsec button.go{margin-top:10px}
#impbox{display:block;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);
     border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;
     line-height:1.5;resize:vertical}
.tip{position:absolute;z-index:45;padding:10px 12px;border-radius:12px;background:#1f2937;
     color:#fff;font-size:13px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.18);
     border:1px solid rgba(255,255,255,.12);animation:tipin .2s ease}
.tip small{display:block;margin-top:3px;font-size:11.5px;opacity:.7}
.tip::after{content:"";position:absolute;left:var(--ax,50%);margin-left:-7px;
     border:7px solid transparent}
.tip.dn::after{bottom:100%;border-bottom-color:#1f2937}
.tip.up::after{top:100%;border-top-color:#1f2937}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.tip{animation:none}}
#sheet button{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;
       padding:13px 16px;border-radius:11px;border:1px solid var(--line);
       background:var(--bg);font-size:14.5px;cursor:pointer;text-align:left}
#sheet .ico{flex:0 0 20px;width:20px;height:20px;line-height:0}
#sheet .ico svg{width:20px;height:20px;display:block}
#sheet .ico svg path{fill:none;stroke:var(--dim);stroke-width:1.7}
#sheet .ico.on svg path{fill:#ca210c;stroke:#ca210c}
#sheet .ico.won{font-size:15.5px;font-weight:800;color:var(--dim);
       line-height:20px;text-align:center}
#sheet .ico.share{font-size:16px;font-weight:700;color:var(--dim);
       line-height:20px;text-align:center}
#sheet button.same{background:var(--good-bg);border-color:transparent;color:var(--good);font-weight:700}
#sheet button.go{background:var(--accent);border-color:var(--accent);color:#fff;
       font-weight:600}
#sheet button.off{color:var(--dim)}
#cartbtn{position:relative;line-height:0;padding:7px 9px}
#cartbtn svg{width:17px;height:17px;display:block}
#cartbtn svg path{fill:#ca210c;stroke:#ca210c;stroke-width:1.5}
#cartn{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;
       border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;
       line-height:17px;text-align:center;display:none}
.cartrow{display:flex;gap:8px;align-items:center;padding:9px 2px;
       border-bottom:1px solid var(--line);font-size:13.5px}
.cartrow span{flex:1;min-width:0}
.cartrow b{font-variant-numeric:tabular-nums}
.cartrow i{color:var(--dim);font-style:normal;cursor:pointer;padding:0 6px}
.pricebox{display:flex;gap:8px;margin:12px 0 4px}
.pricebox input{flex:1;min-width:0;padding:13px;border:1px solid var(--line);
     border-radius:11px;background:var(--bg);font-size:16px;text-align:center}
.pricebox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
@media (pointer:coarse){#q,.pricebox input,#pin,#impbox{font-size:16px}}
.pricebox label{flex:0 0 74px}
.tag-mine{background:var(--accent);border-color:var(--accent);color:#fff}
.tag-df{background:#fff3cd;border-color:#e0b400;color:#7a5c00;font-weight:600}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tag-df{background:#4a3a00;border-color:#8a6d00;color:#ffe08a}
}
[data-theme="dark"] .tag-df{background:#4a3a00;border-color:#8a6d00;color:#ffe08a}
#inbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
     z-index:40;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;
     padding:11px 8px 11px 14px;border-radius:14px;background:var(--card);
     border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;line-height:1.5;
     transform:translateY(160%);transition:transform .25s ease}
#inbar.on{transform:none}
#inbar .t{flex:1;min-width:0}
#inbar .t b{display:block;font-size:13.5px;color:var(--ink)}
#inbar .t span{color:var(--dim)}
#inbar .go{flex:none;padding:9px 12px;border:0;border-radius:10px;background:var(--accent);
     color:#fff;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
#inbar .x{flex:none;width:30px;height:30px;border:0;background:transparent;color:var(--dim);
     font-size:14px;cursor:pointer;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;
     max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--ink);
     color:var(--bg);font-size:13px;line-height:1.5;opacity:0;pointer-events:none;
     transform:translate(-50%,30px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#guide{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.55);
       align-items:center;justify-content:center;padding:16px;overscroll-behavior:contain}
#guide.on{display:flex}
#guide .gcard{position:relative;width:100%;max-width:360px;background:var(--card);
       color:var(--ink);border-radius:16px;padding:20px 18px 16px;box-shadow:var(--shadow);
       max-height:calc(100dvh - 90px);overflow-y:auto;overscroll-behavior:contain}
#guide h3{margin:0 0 12px;padding-right:30px;font-size:16px}
#guide h3 small{font-size:12px;font-weight:600;color:var(--dim);margin-left:4px}
#guide ol{margin:0;padding:0;list-style:none;counter-reset:g}
#guide li{position:relative;padding:0 0 12px 34px;font-size:14px;line-height:1.7;counter-increment:g}
#guide li::before{content:counter(g);position:absolute;left:0;top:1px;width:24px;height:24px;
       border-radius:12px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;
       line-height:24px;text-align:center}
#guide .gchip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;margin:0 1px;
       border:1px solid var(--line);border-radius:7px;background:var(--bg);font-weight:700;
       white-space:nowrap}
#guide li.gwarn{margin:2px -6px 14px;padding:10px 10px 10px 42px;border:2px solid var(--bad);
  border-radius:11px;background:var(--bad-bg);color:var(--bad);font-weight:700}
#guide li.gwarn::before{left:9px;top:11px;background:var(--bad);color:#fff}
#guide li.gwarn small{display:block;margin-top:2px;font-size:12.5px;font-weight:500;
  line-height:1.55;color:var(--ink)}
#guide .gnote{margin:2px 0 12px;color:var(--dim);font-size:12.5px;line-height:1.6}
#guide .gdone{width:100%;padding:12px;border:0;border-radius:11px;background:var(--accent);
       color:#fff;font-weight:700;font-size:14px;cursor:pointer}
#guide .gx{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;
       background:transparent;color:var(--dim);font-size:15px;cursor:pointer}
#guide .garrow{position:fixed;width:0;height:0;border:16px solid transparent}
#guide.at-top-right .garrow{top:6px;right:14px;border-bottom-color:#fff;border-top:0;
       animation:gup 1s ease-in-out infinite}
#guide.at-bottom-right .garrow{bottom:calc(6px + env(safe-area-inset-bottom));right:14px;
       border-top-color:#fff;border-bottom:0;animation:gdn 1s ease-in-out infinite}
#guide.at-bottom-center .garrow{bottom:calc(6px + env(safe-area-inset-bottom));left:calc(50% - 16px);
       border-top-color:#fff;border-bottom:0;animation:gdn 1s ease-in-out infinite}
@keyframes gup{50%{transform:translateY(-8px)}}
@keyframes gdn{50%{transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){#guide .garrow{animation:none}}
#sheet button.go .ico svg path{stroke:#fff}
#cartbar{display:none;gap:6px;padding:8px 12px 0}
#cartbar button{flex:1;min-width:0;padding:8px 4px;border:1px solid var(--line);border-radius:9px;
     background:var(--card);font-size:13px;letter-spacing:-.3px;white-space:nowrap;cursor:pointer}
#cartbar .qh{flex:none;width:36px;padding:8px 0;font-weight:700;color:var(--dim)}
#cartsum{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;
     align-items:center;justify-content:space-between;gap:12px;
     padding:11px 18px calc(11px + env(safe-area-inset-bottom));
     border-radius:16px 16px 0 0;background:#0b7a4b;color:#fff;cursor:pointer;
     font-variant-numeric:tabular-nums;white-space:nowrap}
html.cart-on #cartsum{display:flex}
#cartsum .l{min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
#cartsum .l small{display:block;font-size:12px;opacity:.85}
#cartsum .l b{display:block;font-size:14.5px;font-weight:700}
#cartsum .l b.ov{color:#ffd3cc}
#cartsum .tot{flex:none;font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
#cartsum .tot small{font-size:12px;font-weight:500;opacity:.85;margin-right:4px}
#cartsum .tot i{font-style:normal;font-size:15px;font-weight:400;opacity:.8;margin-left:3px}
html.cart-on body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
html.cart-on #inbar{bottom:calc(66px + env(safe-area-inset-bottom))}
html.cart-on #toast{bottom:calc(74px + env(safe-area-inset-bottom))}
.sumtbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sumtbl td{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumtbl td:last-child{text-align:right;font-weight:700}
.sumtbl tr.sv td:last-child{color:var(--good)}
.sumtbl tr.ov td:last-child{color:var(--bad)}
.cq{display:flex;align-items:center;gap:6px;margin-top:7px}
.cq .qb{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;
     background:var(--bg);font-size:17px;line-height:1;cursor:pointer;padding:0}
.cq .qn{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cq .got{margin-left:auto;height:30px;padding:0 10px;border:1px solid var(--line);
     border-radius:8px;background:var(--bg);font-size:12.5px;cursor:pointer;white-space:nowrap}
.item.bought .got{background:var(--good);border-color:var(--good);color:#fff}
.item.bought .left,.item.bought .nm,.item.bought .sub,.item.bought .pr,.item.bought .tags{opacity:.4}
.item.bought .nm{text-decoration:line-through}
.gal .cq{gap:4px}
.gal .cq .qb{width:28px;height:28px}
.gal .cq .got{padding:0 7px}
.tag-qty{background:var(--accent);color:#fff}
.item{position:relative;-webkit-touch-callout:none;user-select:none}
.item .cart{position:absolute;top:5px;right:7px;padding:3px;cursor:pointer;
     line-height:0}
.item .cart svg{width:22px;height:22px;display:block}
.item .cart svg path{fill:none;stroke:var(--dim);stroke-width:1.7;opacity:.6}
.item .cart.on svg path{fill:#ca210c;stroke:#ca210c;opacity:1}

@media(min-width:720px){#list.gal{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){#list.gal{grid-template-columns:repeat(4,1fr)}}
.gal .item{display:block;padding:0;overflow:hidden}
.gal .left{flex:none}
.gal .thumb{width:100%;height:auto;aspect-ratio:1/1;border-radius:0;
     background:#fff;padding:7%;cursor:zoom-in}
.gal .body{padding:8px 9px 10px}
.gal .nm{font-size:13.5px;line-height:1.35;min-height:2.7em;padding-right:0;
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gal .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .pr{display:grid;grid-template-columns:minmax(0,1fr) auto;

.gal .pr .g{grid-area:g;font-size:15px}
.gal .pr .c{grid-area:c;display:block;min-height:1.4em;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .side{grid-area:side;margin:0}
.gal .badge{font-size:11.5px;padding:3px 6px}
.gal .gap{font-size:11.5px;margin-top:2px}
.gal .tags{display:none}
.gal .pr .g,.gal .gap{white-space:nowrap}
.gal .side,.gal .badge{white-space:normal;word-break:keep-all}
.gal .side:has(.b-nm){position:absolute;left:7px;top:7px;margin:0;text-align:left}
@media(max-width:340px){
  .gal .pr .c,.gal .gap{font-size:11px}
}
.gal .item .cart,.gal .item .cpg{width:30px;height:30px;border-radius:15px;padding:0;

.gal .item .cart{top:7px;right:7px}
.gal .item .cpg{top:7px;right:49px}
#mode svg{width:17px;height:17px;display:block;margin:0 auto}
.brand .lg{flex:0 0 28px;display:block}
.brand b{font-size:20px;font-weight:900;letter-spacing:-.2px}
.brand b em{font-style:normal;color:#11974B}
@media(max-width:370px){.brand .lg{width:24px;height:24px;flex-basis:24px}.top .brand b{font-size:17px}}

  main{grid-template-columns:1fr 1fr}
  #list.gal{grid-template-columns:repeat(3,1fr)}
  #cartsum{left:50%;right:auto;width:768px;transform:translateX(-50%)}

<script>
const KEY_NAME = "gmpx-key";
const OPEN = true;   /* --공개 로 구우면 true 가 박힌다 */
const $ = s => document.querySelector(s);

async function derive(pw, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
                                             "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}

let KEY = null;

async function unlock(pw, remember){
  if (OPEN) return await (await fetch("/data.json?v=f3718da4c3",
                                      {referrerPolicy: "same-origin"})).json();
  const buf = await (await fetch("data.bin", {cache:"no-cache"})).arrayBuffer();
  const raw = new Uint8Array(buf);
  const salt = raw.slice(5, 21), iv = raw.slice(21, 33), body = raw.slice(33);
  KEY = await derive(pw, salt);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, KEY, body);
  const data = JSON.parse(new TextDecoder().decode(plain));
  if (remember) { try { localStorage.setItem(KEY_NAME, pw); } catch(e){} }
  else { try { sessionStorage.setItem(KEY_NAME, pw); } catch(e){} }
  return data;
}

async function loadPics(){
  try {
    if (OPEN) {
      const u = "/pics.json?v=8d836ccc02", PK = "gmpx-pics";
      let seen = false;
      try { seen = localStorage.getItem(PK) === u; } catch (e) {}
      if (!seen) await new Promise(ok => setTimeout(ok, 3000));
      PICS = await (await fetch(u, seen ? {referrerPolicy: "same-origin"}
                                        : {referrerPolicy: "same-origin", priority: "low"})).json();
      try { localStorage.setItem(PK, u); } catch (e) {}
      setTimeout(warmAll, 0);
      PICSDONE = true;
      for (const el of document.querySelectorAll("img.thumb:not([src])")) paint(el);
      return;
    }
    const raw = new Uint8Array(await (await fetch("pics.bin", {cache:"no-cache"})).arrayBuffer());
    const plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv: raw.slice(5, 17)}, KEY, raw.slice(17));
    PICS = JSON.parse(new TextDecoder().decode(plain));
    PICSDONE = true;
    for (const el of document.querySelectorAll("img.thumb:not([src])")) paint(el);
  } catch (e) { /* 사진 없이 그냥 쓴다 */ setTimeout(warmAll, 3000); }
}
const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
let PICSDONE = false;      // 사진 뭉치를 다 받았나

function paint(el){
  const b = PICS[el.dataset.p];
  if (b) el.src = "data:image/webp;base64," + b;
  else if (PICSDONE){ el.src = BLANK; el.dataset.nopic = "1"; }
}

if ($("#go")) $("#go").addEventListener("click", async () => {
  const pw = $("#pw").value;
  if (!pw) return;
  $("#go").disabled = true; $("#err").textContent = "여는 중…";
  try { start(await unlock(pw, $("#keep").checked)); }
  catch (e) { $("#err").textContent = "맞지 않습니다"; $("#pw").select(); }
  finally { if ($("#go")) $("#go").disabled = false; }
});
if ($("#pw")) $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });

(function(){
  const ios = /iP(hone|od|ad)/.test(navigator.userAgent)
           || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const vp = document.querySelector('meta[name="viewport"]');
  if (!ios || !vp) return;
  const base = vp.content;
  document.addEventListener("touchstart", e => {
    if (e.target.closest && e.target.closest("select"))
      vp.content = base + ", maximum-scale=1";
  }, {capture:true, passive:true});
  document.addEventListener("focusout", e => {
    if (e.target.tagName === "SELECT") setTimeout(() => { vp.content = base; }, 400);
  }, true);
})();

(async function auto(){
  let pw = null;
  if (OPEN) {
    const full = unlock(null, false);
    let first = null;
    try {
      const fe = document.getElementById("first");
      if (fe && !location.hash && !/[?&](h|imp)=/.test(location.search)
          && !sessionStorage.getItem("gmpx-state"))
        first = JSON.parse(fe.textContent);
    } catch(e){ first = null; }
    if (first){
      if (document.readyState === "loading")
        await new Promise(r => addEventListener("DOMContentLoaded", r, {once: true}));
      PARTIAL = true;
      Object.assign(PICS, first.pics || {});
      start(first.data);
      $("#wait").style.display = "none";
      try { upgrade(await full); }
      catch(e){ toast("목록을 다 못 불러왔어요 · 새로고침해 주세요"); }
      return;
    }
    try { start(await full); }
    catch(e){
      $("#wait").innerHTML = "<div>불러오지 못했어요</div>"
        + '<button type="button" onclick="location.reload()">다시 열기</button>';
      return;
    }
    $("#wait").style.display = "none";
    return;
  }
  try { pw = localStorage.getItem(KEY_NAME) || sessionStorage.getItem(KEY_NAME); } catch(e){}
  if (!pw) {                       // 잠긴 판 · 처음 온 사람 — 이때만 잠금 화면
    if ($("#lock")) $("#lock").style.visibility = "visible";
    $("#wait").style.display = "none";
    return;
  }
  const lock = $("#lock");
  if (lock) lock.style.visibility = "hidden";
  $("#wait").style.display = "flex";
  try { start(await unlock(pw, true)); }
  catch(e){
    try{ localStorage.removeItem(KEY_NAME); sessionStorage.removeItem(KEY_NAME);}catch(_){}
    if (lock) lock.style.visibility = "visible";
  }
  $("#wait").style.display = "none";
})();

const CHO  = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG = "␀ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ";

function toJamo(s){
  let out = "";
  for (const ch of s){
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3){
      const i = c - 0xAC00;
      out += CHO[(i / 588) | 0] + JUNG[((i % 588) / 28) | 0];
      const j = i % 28; if (j) out += JONG[j];
    } else out += ch;
  }
  return out;
}
function toCho(s){
  let out = "";
  for (const ch of s){
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) out += CHO[((c - 0xAC00) / 588) | 0];
    else if (CHO.includes(ch)) out += ch;
    else if (/[0-9a-z]/i.test(ch)) out += ch.toLowerCase();
  }
  return out;
}
const CHO_ONLY = /^[ㄱ-ㅎ0-9a-z]+$/i;
const noSpace = s => toJamo(String(s).replace(/\s+/g, ""));

let PARTIAL = false;   // 첫 화면 자료로만 그린 동안 — 건수·통계를 안 적는다
const HIDE_SUB = ["담배"];
let DATA = [], VIEW = [], BIG = "전체", SHOWN = 0, CP = "", WAIT = "", PICS = {};
const ONL = "온라인";
const srcOf = it => it.sub === "담배" ? "정가" : it.big === "주류" ? "시중가"
                  : it.conv ? ONL : CP;
const iGa = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00;
                   return c >= 0 && c < 11172 && c % 28 ? "이" : "가"; };
let ONLY = "";
let WLIST = null;
let SUB = "";
const subN = k => DATA.reduce((n, x) => n + (x.sub === k ? 1 : 0), 0);
let CARRY = null;
(function(){
  try {
    if (!sessionStorage.getItem("gmpx-sess")){
      sessionStorage.setItem("gmpx-sess", "1");
      localStorage.setItem("gmpx-visits", String(Number(localStorage.getItem("gmpx-visits") || 0) + 1));
    }
  } catch(e){}
  try {
    const q = new URLSearchParams(location.search);
    if (q.get("home") === "1"){
      try { localStorage.setItem("gmpx-home", "1"); } catch(e){}
      if (!q.get("h") && !q.get("imp")){
        history.replaceState(null, "", location.pathname + location.hash);
        return;
      }
    }
    const h = q.get("h"), imp = q.get("imp");
    if (!h && !imp) return;
    if (imp) CARRY = {imp: imp, from: q.get("from") || ""};
    history.replaceState(null, "", location.pathname + (h ? "#" + h : ""));
  } catch(e){}
})();
let TITLE0 = document.title;   // 공유로 바꾼 탭 제목을 되돌릴 때 쓴다
const won = n => n == null ? "–" : n.toLocaleString("ko-KR") + "원";
const pct = n => (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const wonDiff = n => (n > 0 ? "+" : "") + n.toLocaleString("ko-KR") + "원";

function prepItems(items){
  for (const it of items){
    const all = it.hb + " " + it.hx;
    it._b = noSpace(it.hb);   it._x = noSpace(all);
    it._cb = toCho(it.hb);    it._cx = toCho(all);
    it._bw  = it.hb.split(/\s+/).map(noSpace).join(" ");
    it._cbw = it.hb.split(/\s+/).map(toCho).join(" ");
  }
}

function start(d){
  DATA = d.items.filter(i => !HIDE_SUB.includes(i.sub));
  document.title = TITLE0 = d.title;
  $("#foot").innerHTML = d.foot;
  $("#q").placeholder = d.hint;
  CP = d.cp;
  $("#sort").innerHTML = d.sorts.map(o =>
      '<option value="' + o[0] + '">' + o[1] + "</option>").join("");
  $("#view").innerHTML = d.views.map(o =>
      '<option value="' + o[0] + '">' + o[1] + "</option>").join("");
  WAIT = d.wait;
  for (let i = 0; i < 3; i++) $("#c" + (i + 1)).textContent = d.caps[i];
  prepItems(DATA);
  applyMine();
  const bigs = ["전체", ...d.bigs];
  setTimeout(markMine, 0);
  $("#chips").innerHTML = bigs.map(b =>
    '<button class="chip' + (b === "전체" ? " on" : "") + '" data-b="' + b + '">' +
    b + "</button>").join("");
  $("#subchips").addEventListener("click", e => {
    const b = e.target.closest(".sc"); if (!b) return;
    SUB = b.dataset.s;
    tipUsed("subs");
    run();
    toTop();
  });
  $("#chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    leaveCart();
    BIG = b.dataset.b;
    SUB = "";
    $("#chips").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
    runFresh();
    toTop();
  });
  const _lk = $("#lock"); if (_lk) _lk.remove();        // 공개판엔 처음부터 없다
  $("#app").hidden = false;
  const raw = location.hash.slice(1);
  const shared = /^p=[0-9]+$/.test(raw) ? raw.slice(2) : "";
  const wantBig = raw.indexOf("c=") === 0
                ? decodeURIComponent(raw.slice(2)) : "";
  const sIt = shared ? DATA.find(x => x.p === shared) : null;
  if (/^w=[0-9x-]+$/.test(raw)) {
    const have = new Set(DATA.map(x => x.p));
    WQ = {};
    const got = [...new Set(raw.slice(2).split("-").map(t => {
      const m = t.match(/^([0-9]+)(?:x([0-9]{1,2}))?$/);
      if (!m) return "";
      if (m[2] && Number(m[2]) > 1) WQ[m[1]] = Number(m[2]);
      return m[1];
    }))].filter(c => have.has(c));
    if (got.length) {
      WLIST = new Set(got);
      $("#onlybar").style.display = "flex";
      $("#onlytext").textContent = "공유받은 찜 목록 " + got.length + "개예요";
      const tk = $("#onlytake");
      tk.hidden = false;
      tk.disabled = got.every(inCart);
      tk.textContent = tk.disabled ? "이미 다 찜했어요" : "내 찜에 담기";
      document.title = "PX 찜 목록 " + got.length + "개";
    }
  }
  if (sIt){
    ONLY = shared;
    $("#onlybar").style.display = "flex";
    $("#onlytext").textContent = "눌러서 들어온 상품이에요";
    document.title = sIt.name;
  }
  if (CARRY){
    const from = {kakao: "카톡", naver: "네이버 앱", insta: "인스타", fb: "페이스북",
                  line: "라인", band: "밴드", daum: "다음 앱"}[CARRY.from] || "앱";
    try {
      const [a, m] = unpack(CARRY.imp);
      const what = a && m ? "찜한 " + a + "개와 넣은 값 " + m + "개를"
                 : a ? "찜한 " + a + "개를" : m ? "넣은 값 " + m + "개를" : "";
      if (what) setTimeout(() => toast(from + "에서 " + what + " 가져왔어요"), 700);
    } catch(e){}
    CARRY = null;
  }
  if (raw === "noapp"){
    try { history.replaceState({}, "", location.pathname); } catch(e){}
    setTimeout(openNoApp, 400);
  } else if (raw.indexOf("import=") === 0){
    let msg = "가져오지 못했습니다";
    try {
      const [a, m] = unpack(raw.slice(7));
      msg = "가져왔습니다 — 찜 " + a + "건, 넣은 값 " + m + "건";
    } catch (e) {}
    try { history.replaceState({}, "", location.pathname); } catch(e){}
    setTimeout(() => alert(msg), 300);
  } else if (wantBig) {
    BIG = wantBig;
    $("#chips").querySelectorAll(".chip").forEach(
        c => c.classList.toggle("on", c.dataset.b === wantBig));
  } else if (!sIt && !WLIST) {
    const h = decodeURIComponent(raw);
    if (h) $("#q").value = h;
  }
  let back = null;
  try {
    back = JSON.parse(sessionStorage.getItem(STATE_KEY) || "null");
    sessionStorage.removeItem(STATE_KEY);
  } catch(e){}
  if (back){
    $("#q").value = back.q || "";
    BIG = back.big || "전체";
    SUB = back.sub || "";
    $("#chips").querySelectorAll(".chip").forEach(
        c => c.classList.toggle("on", c.dataset.b === BIG));
    $("#view").value = back.view || "all";
    useSort(back.sort);
  }
  setMode(GAL);
  run();
  if (back && back.y){
    let guard = 0;
    while (document.body.offsetHeight < back.y + innerHeight && SHOWN < VIEW.length
           && guard++ < 80) more();
    window.scrollTo(0, back.y);
  } else if (matchMedia("(hover:hover) and (pointer:fine)").matches) {
    $("#q").focus({preventScroll:true});
  }
  loadPics();
}

function goHome(){
  ONLY = "";
  WLIST = null; $("#onlytake").hidden = true;
  document.title = TITLE0;
  const bar = $("#onlybar");
  if (bar) bar.style.display = "none";
  $("#q").value = "";
  BIG = "전체"; SUB = "";
  $("#chips").querySelectorAll(".chip").forEach(
      c => c.classList.toggle("on", c.dataset.b === "전체"));
  if ($("#view").options.length) $("#view").selectedIndex = 0;
  if ($("#sort").options.length) $("#sort").selectedIndex = 0;   // `기타` 로
  SORTK = "rv";
  for (const b of document.querySelectorAll(".sortbar .sb[data-k]"))
    b.classList.toggle("on", b.dataset.k === "rv");
  const sw = $(".sortbar .selwrap"); if (sw) sw.classList.remove("on");
  try { history.replaceState({}, "", location.pathname); } catch(e){}
  runFresh();
  scrollTo(0, 0);
}
$("#home").addEventListener("click", e => { e.preventDefault(); goHome(); });

function toTop(){ if (scrollY > 0) scrollTo(0, 0); }
function leaveCart(){
  if ($("#view").value !== "cart") return false;
  $("#view").value = "all"; PREV = null;
  try { if (history.state && history.state.cart) history.replaceState(null, ""); } catch(e){}
  return true;
}
$("#q").addEventListener("input", () => { SUB = ""; leaveCart(); runFresh(); toTop(); });
(function(){
  const hd = $("header"), sp = $("#hdsp");
  if (!hd || !sp) return;
  const narrow = matchMedia("(max-width:719px)");
  const fit = () => {
    if (hd.classList.contains("cmp") || !hd.offsetHeight) return;   // 숨겨져 있을 땐(첫 화면 전) 안 잰다
    sp.style.height = hd.offsetHeight + "px";
  };
  window.fitHead = fit;
  if (window.ResizeObserver) new ResizeObserver(() => { if (scrollY < 8) fit(); }).observe(hd);
  fit();
  let off = 0, lastY = Math.max(0, scrollY), idle = 0;
  const apply = anim => {
    const h = hd.offsetHeight;
    hd.style.transition = anim ? "transform .15s ease" : "none";
    hd.style.transform = off ? "translateY(" + (-off) + "px)" : "";
    hd.classList.toggle("cmp", off >= h);
    hd.classList.toggle("up", off < h && scrollY > h);   // 목록 위에 떠 있을 땐 그림자
  };
  const set = on => { off = on ? hd.offsetHeight : 0; apply(true); };
  addEventListener("scroll", () => {
    const y = Math.max(0, scrollY), dy = y - lastY; lastY = y;
    if (!narrow.matches){ if (off){ off = 0; apply(false); } return; }
    const h = hd.offsetHeight;
    off = Math.min(h, Math.max(0, off + dy));
    if (y < h) off = Math.min(off, y);            // 맨 위 근처 — 빈칸이 드러나지 않게
    apply(false);
    clearTimeout(idle);
    idle = setTimeout(() => {
      const hh = hd.offsetHeight;
      if (off > 0 && off < hh){ off = (off > hh / 2 && scrollY > hh) ? hh : 0; apply(true); }
      if (scrollY < 8) fit();
    }, 140);
  }, {passive: true});
  $("#curtag").addEventListener("click", e => {
    e.preventDefault();
    if (e.target.closest("i")){                 // ✕ — 전체로
      BIG = "전체"; SUB = "";
      $("#chips").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.b === "전체"));
      runFresh();
      scrollTo(0, 0);
      return;
    }
    set(false);                                   // 글자 — 칩을 다시 펼친다
  });
})();
let SORTK = "rv";
function useSort(k){
  const sel = $("#sort");
  if (!k || k === "mine") k = SORTK || "rv";          // 옛 기록(드롭다운 빈 값) · 거르기는 정렬이 아니다
  SORTK = k;
  sel.value = sel.querySelector('option[value="' + k + '"]') ? k : "";
  for (const b of document.querySelectorAll(".sortbar .sb[data-k]"))
    b.classList.toggle("on", !sel.value && b.dataset.k === SORTK);
  $(".sortbar .selwrap").classList.toggle("on", !!sel.value);
}
function setSort(k){
  const was = $("#view").value;
  const sel = $("#sort");
  if (k === "mine"){
    $("#view").value = "mine";
  } else {
    SORTK = k;
    if (was === "mine") $("#view").value = "all";
    if (sel.querySelector('option[value="' + k + '"]') === null) sel.value = "";
  }
  for (const b of document.querySelectorAll(".sortbar .sb[data-k]"))
    b.classList.toggle("on", !sel.value && b.dataset.k === SORTK);
  $(".sortbar .selwrap").classList.toggle("on", !!sel.value);
  ($("#view").value !== was ? runFresh : run)();
  toTop();
}
for (const b of document.querySelectorAll(".sortbar .sb[data-k]"))
  b.addEventListener("click", () => setSort(b.dataset.k));
$("#sort").addEventListener("change", () => setSort($("#sort").value || SORTK));
$("#view").addEventListener("change", runFresh);
$("#clr").addEventListener("click", () => { $("#q").value = ""; run(); toTop(); $("#q").focus(); });
function themeLabel(){
  const el = $("#themelb");
  if (!el) return;
  el.textContent =
      document.documentElement.getAttribute("data-theme") === "dark"
      ? "라이트" : "다크";
}
$("#theme").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("gmpx-theme", next); } catch(e){}
  themeLabel();
});
try {
  const t = localStorage.getItem("gmpx-theme");
  document.documentElement.setAttribute("data-theme", t || "light");
} catch(e){ document.documentElement.setAttribute("data-theme", "light"); }
addEventListener("DOMContentLoaded", themeLabel);

function run(){
  const raw = $("#q").value.trim();
  $("#clr").style.display = raw ? "block" : "none";
  try {
    if (!ONLY && !WLIST)
      history.replaceState(history.state, "", raw ? "#" + encodeURIComponent(raw) : " ");
  } catch(e){}

  const toks = raw.split(/\s+/).filter(Boolean).map(t => ({
    j: noSpace(t.toLowerCase()),
    c: toCho(t),
    cho: CHO_ONLY.test(t) && !/[가-힣]/.test(t)
  }));

  const view = $("#view").value || "all";

  const pass = (it, big, vw, scoring) => {
    if (ONLY) return it.p === ONLY;      // 공유받은 한 줄만
    if (WLIST) return WLIST.has(it.p);   // 공유받은 찜 목록만
    if (big !== "전체" && it.big !== big) return false;
    if (vw !== "cart" && !KEEP.has(it.p)){
      if (vw === "done" && it.rate == null) return false;
      if (vw === "none" && !it.nm) return false;
      if (vw === "wait" && (it.rate != null || it.nm)) return false;
      if (vw === "mine" && !it.mine) return false;
    }
    if (vw === "cart" && !inCart(it.p)) return false;
    let score = 0;
    for (const t of toks){
      const inBody = t.cho ? it._cb.includes(t.c) : it._b.includes(t.j);
      const inAll  = t.cho ? it._cx.includes(t.c) : it._x.includes(t.j);
      if (!inBody && !inAll) return false;
      const head = t.cho ? (" " + it._cbw).includes(" " + t.c)
                         : (" " + it._bw ).includes(" " + t.j);
      score += head ? 4 : (inBody ? 2 : 1);
    }
    if (scoring) it._s = score;
    return true;
  };
  const BASE = DATA.filter(it => pass(it, BIG, view, true));
  VIEW = SUB ? BASE.filter(it => it.sub === SUB) : BASE;
  subChips(BASE, raw, view);
  curTag();

  if (SORTK === "rate" || SORTK === "rate_up")
    VIEW = VIEW.filter(it => it.rate != null);

  const k = SORTK;
  const big = 1e12;
  VIEW.sort((a, b) => {
    if (toks.length && k === "rv" && b._s !== a._s) return b._s - a._s;
    const A = a.rate == null ? big : a.rate, B = b.rate == null ? big : b.rate;
    switch (k){
      case "rv":      return (b.rv || 0) - (a.rv || 0);
      case "rate":    return A - B;
      case "rate_up": return (a.rate == null ? -big : -a.rate) - (b.rate == null ? -big : -b.rate);
      case "diff":    return (a.diff == null ? big : a.diff) - (b.diff == null ? big : b.diff);
      case "gm_dn":   return b.g - a.g;
      case "gm_up":   return a.g - b.g;
      case "name":    return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
      default:        return a.no - b.no;
    }
  });

  const bar = $("#cartbar");
  bar.style.display = (view === "cart" || view === "mine") ? "flex" : "none";
  $("#cartbtn").classList.toggle("on", view === "cart");
  bar.dataset.mode = view;
  bar.children[0].style.display = view === "mine" ? "none" : "";   // 공유하기
  bar.children[1].textContent = view === "mine" ? "직접 입력한 값 복사" : "찜 가져오기";
  bar.children[1].dataset.act = view === "mine" ? "copyall" : "importcart";
  bar.children[3].style.display = view === "mine" ? "none" : "";
  bar.children[2].textContent = view === "mine" ? "직접 입력한 값 모두 지우기"
                                                : "찜 비우기";
  stats();
  cartSum();

  SHOWN = 0;
  $("#list").innerHTML = "";
  if (!VIEW.length){
    $("#list").innerHTML = emptyHTML(raw, view, pass);
    return;
  }
  more();
  scheduleTips();
}

function emptyHTML(raw, view, pass){
  const vName = n => {
    const o = [...$("#view").options].find(o => o.value === n);
    return o ? o.textContent : n;
  };
  const outs = [];
  if (BIG !== "전체"){
    const n = DATA.filter(it => pass(it, "전체", view, false)).length;
    if (n) outs.push({n, label: "전체에서 보기 (" + n.toLocaleString("ko-KR") + "건)",
                      act: "big"});
  }
  if (view !== "all"){
    const n = DATA.filter(it => pass(it, BIG, "all", false)).length;
    if (n) outs.push({n, label: vName("all") + " (" + n.toLocaleString("ko-KR") + "건)",
                      act: "view"});
  }
  if (BIG !== "전체" && view !== "all"){
    const n = DATA.filter(it => pass(it, "전체", "all", false)).length;
    if (n && !outs.some(o => o.n === n)) outs.push({
      n, label: "둘 다 풀기 (" + n.toLocaleString("ko-KR") + "건)", act: "both"});
  }
  const jo = (w, withT, noT, lIsNo) => {
    const c = w.charCodeAt(w.length - 1);
    if (c < 0xAC00 || c > 0xD7A3) return noT;
    const t = (c - 0xAC00) % 28;
    if (!t) return noT;
    return (lIsNo && t === 8) ? noT : withT;
  };
  const quoted = raw ? "‘" + esc(raw) + "’" : "";
  let head = raw ? quoted + jo(raw, "으로", "로", true) + " 찾은 것이 없습니다"
                 : "여기에 보여 줄 것이 없습니다";
  if (raw && BIG !== "전체")
    head = quoted + jo(raw, "은", "는") + " " + esc(BIG) + "에 없습니다";
  let html = '<div class="empty"><div class="e-head">' + head + "</div>";
  if (outs.length){
    html += '<div class="e-sub">이렇게 하면 나옵니다</div><div class="e-btns">';
    for (const o of outs)
      html += '<button class="e-go" data-act="' + o.act + '">' + o.label + "</button>";
    html += "</div>";
  } else if (raw){
    html += '<div class="e-sub">띄어쓰기를 줄이거나 낱말을 하나만 남겨 보세요.'
         +  '<br>초성으로도 찾힙니다 — <b>ㅅㅋㄹ</b> 로 선크림</div>'
         +  '<div class="e-btns"><button class="e-go" data-act="clear">'
         +  '찾기 지우기</button></div>';
  }
  return html + "</div>";
}

function median(a){
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function upgrade(d){
  const firstCodes = VIEW.map(i => i.p);
  DATA = d.items.filter(i => !HIDE_SUB.includes(i.sub));
  prepItems(DATA);
  applyMine();
  setTimeout(markMine, 0);
  PARTIAL = false;
  const plain = !$("#q").value.trim() && BIG === "전체" && ($("#view").value || "all") === "all"
             && SORTK === "rv" && !ONLY && !WLIST && !KEEP.size;
  if (plain){
    const all = DATA.slice().sort((a, b) => (b.rv || 0) - (a.rv || 0));
    if (firstCodes.every((p, i) => all[i] && all[i].p === p)){
      VIEW = all;
      stats();
      if (innerHeight + scrollY > document.body.offsetHeight - 700) more();
      return;
    }
  }
  run();
}

function stats(){
  if (PARTIAL){ $("#hits").textContent = ""; return; }
  $("#hits").textContent = VIEW.length.toLocaleString("ko-KR") + "건";
  const done = VIEW.filter(i => i.rate != null);
  $("#s1").textContent = done.length.toLocaleString("ko-KR") + " / "
      + VIEW.length.toLocaleString("ko-KR");
  const rates = done.map(i => i.rate).sort((a, b) => a - b);
  $("#s2").textContent = rates.length ? pct(median(rates)) : "–";
  $("#s3").textContent = done.length
      ? Math.round(100 * done.filter(i => i.rate < 0).length / done.length) + "%" : "–";
}

function refreshCard(p){
  const it = DATA.find(x => x.p === p);
  const el = document.querySelector('.item[data-p="' + p + '"]');
  if (!it || !el) return run();
  el.outerHTML = card(it, $("#q").value.trim());
  sharpen_all();
  stats();
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hi(name, raw){
  const safe = esc(name);
  if (!raw) return safe;
  let out = safe;
  for (const t of raw.split(/\s+/).filter(Boolean)){
    const e = esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (e) out = out.replace(new RegExp(e, "gi"), m => "<mark>" + m + "</mark>");
  }
  return out;
}

function card(it, raw){
  const cls = it.nm ? "b-none b-nm"
            : it.rate == null ? "b-none"
            : it.rate < 0 ? "b-good"
            : it.rate === 0 ? "b-mid" : "b-bad";
  const badge = '<span class="badge ' + cls + '">' +
      (it.nm ? "비교군 없음" : it.rate == null ? WAIT : pct(it.rate)) + "</span>" +
      '<span class="gap">' +
      (it.rate == null ? "&nbsp;" : wonDiff(it.diff)) + "</span>";
  const tags = [];
  if (it.df) tags.push('<span class="tag tag-df" title="' +
      esc(it.df === 2 ? "해외파병용입니다. 일반 판매가 아닙니다."

const BIGPIC = {};
async function showBig(p, quiet){
  if (BIGPIC[p]) { if (!quiet) $("#zoom img").src = BIGPIC[p]; return; }
  try {
    if (OPEN) {
      BIGPIC[p] = "/big/" + p + ".jpg";
      if (!quiet && $("#zoom").style.display === "flex") $("#zoom img").src = BIGPIC[p];
      return;
    }
    const raw = new Uint8Array(await (await fetch("/big/" + p + ".bin")).arrayBuffer());
    const plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv: raw.slice(5, 17)}, KEY, raw.slice(17));
    BIGPIC[p] = URL.createObjectURL(new Blob([plain], {type:"image/jpeg"}));
    if (!quiet && $("#zoom").style.display === "flex") $("#zoom img").src = BIGPIC[p];
  } catch (e) { /* 작은 그림 그대로 둔다 */ }
}

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let out = "";
  for (let i = 0; i < bytes.length; i += 4096)
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
  return btoa(out).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64dec(t){
  const raw = atob(t.replace(/-/g, "+").replace(/_/g, "/"));
  return new TextDecoder().decode(
      Uint8Array.from(raw, c => c.charCodeAt(0)));
}
function packed(){
  return b64enc(JSON.stringify({v: 1, c: CART, m: MINE, q: CQ}));
}
function unpack(text){
  const t = String(text || "").trim();
  const at = t.indexOf("#import=");
  const data = JSON.parse(b64dec(at >= 0 ? t.slice(at + 8) : t));
  if (!data || data.v !== 1) throw new Error("모양이 다릅니다");
  for (const p of (data.c || [])) if (!inCart(p)){
    CART.push(p);
    if (data.q && data.q[p] > 1) CQ[p] = data.q[p];
  }
  for (const p of Object.keys(data.m || {})) MINE[p] = data.m[p];
  saveCart(); saveCQ(); saveMine();
  return [(data.c || []).length, Object.keys(data.m || {}).length];
}

const SHARP = new Set();          // 다 받아서 곧바로 그릴 수 있는 원본
const NOPIC = new Set();          // 원본이 없는 상품 (4건) — 다시 묻지 않는다
const BUSY  = new Set();          // 미리 받기가 지금 받고 있는 것
async function sharpen(img){
  const p = img.dataset.p;
  if (!p || img.dataset.nopic || NOPIC.has(p)) return;
  if (PICSDONE && !PICS[p]) return;                 // 원래 사진이 없는 상품
  if (!SHARP.has(p)) {
    await showBig(p, 1);
    if (!BIGPIC[p]) return;
    const ok = await new Promise(done => {
      const pre = new Image();
      pre.onload = () => done(true);
      pre.onerror = () => done(false);
      pre.src = BIGPIC[p];
    });
    if (!ok) { img.dataset.nopic = "1"; NOPIC.add(p); return; }
    SHARP.add(p);
  }
  if (img.isConnected) img.src = BIGPIC[p];
}
function sharpen_all(){
  for (const img of document.querySelectorAll("#list img.thumb")){
    const p = img.dataset.p;
    if (SHARP.has(p)) img.src = BIGPIC[p];
    else if (PICOBS && !img.dataset.nopic) PICOBS.observe(img);

  try { if (navigator.connection && navigator.connection.saveData) return; } catch (e) {}
  WARMING = true;
  const next = () => {
    for (const list of [VIEW, DATA])
      for (const it of list)
        if (!SHARP.has(it.p) && !NOPIC.has(it.p) && !BUSY.has(it.p)
            && !(PICSDONE && !PICS[it.p])) return it.p;
    return null;
  };
  const lane = () => {
    const p = next();
    if (!p) return;                                  // 다 받았다
    BUSY.add(p);
    const pre = new Image();
    try { pre.fetchPriority = "low"; } catch (e) {}
    pre.onload = () => {
      BUSY.delete(p); SHARP.add(p);
      BIGPIC[p] = BIGPIC[p] || "/big/" + p + ".jpg";
      for (const img of document.querySelectorAll('#list img.thumb[data-p="' + p + '"]'))
        if (!img.dataset.nopic) img.src = BIGPIC[p];
      lane();
    };
    pre.onerror = () => { BUSY.delete(p); NOPIC.add(p); lane(); };
    pre.src = "/big/" + p + ".jpg";
  };
  for (let i = 0; i < 50; i++) lane();
}

function keepAdd(p){
  KEEP.add(p);

}

const MINE_KEY = "gmpx-mine";
let MINE = {};
try { MINE = JSON.parse(localStorage.getItem(MINE_KEY) || "{}") || {}; } catch(e){}

function saveMine(){
  try { localStorage.setItem(MINE_KEY, JSON.stringify(MINE)); } catch(e){}
  applyMine();
  markMine();
}

function markMine(){
  const n = Object.keys(MINE).length;
  for (const sel of ["#sort", "#view"]){
    const opt = $(sel).querySelector('option[value="mine"]');
    if (opt) opt.textContent = n ? "직접 입력한 것 " + n + "건" : "직접 입력한 것";
  }
}

function applyMine(){
  for (const it of DATA){
    if (it.c0 === undefined){
      it.c0 = it.c; it.r0 = it.rate; it.d0 = it.diff; it.q0 = it.q; it.n0 = it.nm;
    }
    const m = MINE[it.p];
    if (!m){
      it.c = it.c0; it.rate = it.r0; it.diff = it.d0;
      it.q = it.q0; it.nm = it.n0; it.mine = 0;
      continue;
    }
    it.mine = 1;
    if (m.nm){ it.c = null; it.rate = null; it.diff = null; it.nm = 1; continue; }
    it.nm = 0;
    it.q = m.q || 1;
    it.c = Math.round(m.c / it.q);
    it.diff = it.c ? it.g - it.c : null;
    it.rate = it.c ? Math.round((it.g - it.c) / it.c * 1000) / 10 : null;
  }
}

function mineText(){
  return Object.keys(MINE).map(p => {
    const m = MINE[p];
    return m.nm ? p + ", 없음" : p + ", " + m.c + ", " + (m.q || 1);
  }).join("\n");
}

$("#sheet").addEventListener("click", e => {
  if (e.target.id === "sheet") closeSheet();
  const b = e.target.closest("button, .x"); if (!b) return;
  const p = b.dataset.p, act = b.dataset.act;
  if (act === "close") return closeSheet();
  if (act === "help") return openHelp();
  if (act === "hgo") return helpGo(b.dataset.go);
  if (act === "samesub"){
    const it = DATA.find(x => x.p === p); if (!it) return;
    closeSheet();
    return setTimeout(() => sameSub(it), 0);
  }
  if (act === "import") return openImport();
  if (act === "imppaste"){
    navigator.clipboard.readText().then(t => { $("#impbox").value = t; })
      .catch(() => {
        const er = $("#imperr");
        er.textContent = "붙여넣기가 막혀 있어요. 위 칸을 길게 눌러 붙여 넣어 주세요.";
        er.style.display = "block";
      });
    return;
  }
  if (act === "impdo"){
    const r = importText(($("#impbox") || {}).value);
    if (!r){
      const er = $("#imperr");
      er.textContent = "찜 주소를 찾지 못했어요. 받은 주소나 장보기 목록 글을 통째로 붙여 넣어 주세요.";
      er.style.display = "block";
      return;
    }
    closeSheet();
    toast(r.add ? r.add + "개를 내 찜에 더했어요" + (r.n > r.add ? " (이미 있던 " + (r.n - r.add) + "개는 그대로)" : "")
                : "이미 다 찜에 있어요");
    if ($("#view").value === "cart") run();
    else setTimeout(() => { if ($("#view").value !== "cart" && CART.length) openCart(); }, 400);
    return;
  }
  if (act === "coupang"){
    const it = DATA.find(x => x.p === b.dataset.p);
    return coupang(b.dataset.q, it && it.a);
  }
  if (act === "add"){ CART.push(p); saveCart(); closeSheet(); inappJit(); homeHint(); return run(); }
  if (act === "del"){
    CART = CART.filter(x => x !== p);
    saveCart(); closeSheet(); return run();
  }
  if (act === "share"){
    const it = DATA.find(x => x.p === p);
    if (!it) return;
    let path = location.pathname;
    if (!path.endsWith("/")){
      const cut = path.lastIndexOf("/");
      path = path.slice(cut + 1).includes(".")
           ? path.slice(0, cut + 1)      // 파일 이름이다 — 턴다
           : path + "/";                 // 폴더다 — 슬래시를 붙인다
    }
    path = path.replace(/app\/$/, "");
    const url = location.origin + path + "s/" + p + "/";
    const gap = it.c == null ? null : Math.round(it.c - it.g);
    const line = it.rate == null
      ? "군마트 " + won(it.g)
      : (it.rate < 0
          ? "군마트 " + won(it.g) + " — " + srcOf(it) + "보다 "
            + won(gap) + "(" + Math.abs(Math.round(it.rate)) + "%) 저렴"
          : "군마트 " + won(it.g) + " — " + srcOf(it) + iGa(srcOf(it)) + " "
            + won(-gap) + "(" + Math.round(it.rate) + "%) 저렴");
    if (navigator.share){
      navigator.share({title: it.name, text: line, url: url}).catch(() => {});
      return;
    }
    try { navigator.clipboard.writeText(it.name + "\n" + line + "\n" + url); }
    catch(e){}
    b.textContent = "주소를 복사했습니다";
    return;
  }
  if (act === "copyout"){
    try { navigator.clipboard.writeText(OUT_URL || location.href); } catch(err){}
    b.textContent = "주소를 복사했어요";
    return;
  }
  if (act === "install"){ closeSheet(); return setTimeout(openInstall, 260); }
  if (act === "addchrome") return openIn("com.android.chrome");
  if (act === "noapp") return openNoApp();
  if (act === "cpghome"){ location.href = "https://www.coupang.com/"; return; }
  if (act === "cpginstall"){
    location.href = IOS
      ? "https://apps.apple.com/kr/app/id454434967"
      : "https://play.google.com/store/apps/details?id=com.coupang.mobile";
    return;
  }
  if (act === "movelink"){
    const url = location.origin + location.pathname + "#import=" + packed();
    try { navigator.clipboard.writeText(url); } catch(e){}
    b.textContent = "복사했습니다 — 새 주소에서 여세요";
    return;
  }
  if (act === "movein"){
    const t = prompt("옮길 링크나 글을 붙여 넣으세요");
    if (!t) return;
    try {
      const [a, m] = unpack(t);
      closeSheet(); run();
      alert("가져왔습니다 — 찜 " + a + "건, 넣은 값 " + m + "건");
    } catch (e) { alert("읽지 못했습니다. 링크를 통째로 붙여 넣어 주세요."); }
    return;
  }
  if (act === "price") return openPrice(p);
  if (act === "save"){
    const c = parseInt(($("#pin").value || "").replace(/[^0-9]/g, ""), 10);
    const q = Math.max(1, parseInt($("#qin").value, 10) || 1);   // 비우면 1
    if (!c) { $("#pin").focus(); return; }
    MINE[p] = {c, q}; keepAdd(p); saveMine(); closeSheet(); return refreshCard(p);
  }
  if (act === "nomatch"){
    MINE[p] = {nm:1}; keepAdd(p); saveMine(); closeSheet(); return refreshCard(p);
  }
  if (act === "unset"){
    delete MINE[p]; keepAdd(p); saveMine(); closeSheet(); return refreshCard(p);
  }
});

  }
  if (!got.length && t.indexOf("#import=") >= 0){   // 앱 안 브라우저에서 넘길 때 쓰는 꾸러미

function homeHave(){
  try { return localStorage.getItem("gmpx-home") === "1"; } catch(e){ return false; }
}

let GUIDE_BACK = "", GUIDE_DONE = "";
function openInstall(){
  if (STANDALONE)
    return openSheet("<h3>홈 화면에 추가</h3>"
      + '<p class="note">이미 홈 화면에서 열고 있어요.</p>');
  closeSheet();
  const g = guideFor();
  GUIDE_BACK = location.pathname + location.search + location.hash;
  try { history.replaceState(history.state, "", location.pathname + "?home=1"); } catch(e){}
  let el = $("#guide");
  if (!el){
    el = document.createElement("div");
    el.id = "guide";
    document.body.appendChild(el);
    el.addEventListener("click", e => {
      if (e.target.closest(".gdone")) return closeGuide(true);
      if (!e.target.closest(".gcard") || e.target.closest(".gx")) closeGuide(false);
    });
  }
  GUIDE_DONE = g.done || "다음부터 홈 화면 아이콘으로 바로 열려요";
  el.className = g.pos ? "on at-" + g.pos : "on";
  document.documentElement.classList.add("sheet-on");
  el.innerHTML =
    (g.pos ? '<div class="garrow" aria-hidden="true"></div>' : "") +
    '<div class="gcard" role="dialog" aria-label="' + g.title + '">' +
      '<button class="gx" aria-label="닫기">&#10005;</button>' +
      "<h3>" + g.title + (g.sub ? " <small>" + g.sub + "</small>" : "") + "</h3>" +
      "<ol>" + g.steps.map(t => t.warn ? '<li class="gwarn">' + t.html + "</li>"
                                       : "<li>" + t + "</li>").join("") + "</ol>" +
      '<p class="gnote">' + (g.note || "아이콘을 누르면 이 화면이 바로 열려요. 설치나 가입은 없어요.") + "</p>" +
      '<button class="gdone">다 했어요</button>' +
    "</div>";
}
function closeGuide(done){
  const el = $("#guide");
  if (el) el.className = "";
  document.documentElement.classList.remove("sheet-on");
  try { history.replaceState(history.state, "", GUIDE_BACK || location.pathname); } catch(e){}
  try { localStorage.setItem("gmpx-add-until", String(Date.now() + 30 * 864e5)); } catch(e){}
  $("#addbar").hidden = true;
  if (done) toast(GUIDE_DONE);
}

function homeHint(){

  inbar("home");
}

}
setTimeout(webAppNote, 2500);

if (/[?&]install=1\b/.test(location.search)){
