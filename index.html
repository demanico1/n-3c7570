<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Notes</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#16181d; --dim:#6b7280;
  --good:#0f7b3f; --good-bg:#e7f6ec; --bad:#b3261e; --bad-bg:#fdeceb;
  --mid:#8a6d00; --mid-bg:#fdf6e0; --accent:#1c6fd0; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --card:#191c21; --line:#2a2f37; --ink:#e8eaed; --dim:#9aa2ad;
    --good:#5ddb97; --good-bg:#122a1c; --bad:#ff8b80; --bad-bg:#2c1614;
    --mid:#e6c455; --mid-bg:#2a2412; --accent:#6fb0ff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --card:#191c21; --line:#2a2f37; --ink:#e8eaed; --dim:#9aa2ad;
  --good:#5ddb97; --good-bg:#122a1c; --bad:#ff8b80; --bad-bg:#2c1614;
  --mid:#e6c455; --mid-bg:#2a2412; --accent:#6fb0ff; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 아이콘은 전부 <i> 로 넣는데, <i> 의 기본값이 기울임이다. 그 바람에
   별·엑스·원화 표시가 차례로 기울어 보였다. 세 번 같은 데서 났다.
   여기서 한 번에 막는다. 그림(SVG)은 글자가 아니라 영향이 없었다. */
i{font-style:normal}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",
       "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  overflow-wrap:anywhere;
}
button,input,select{font:inherit;color:inherit}

/* ---------- 잠금 화면 ---------- */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      padding:16px;background:var(--bg);z-index:50}
/* 열쇠를 기억해 둔 기기는 잠금 화면 대신 이것만 보고 기다린다. */
#wait{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      flex-direction:column;gap:14px;background:var(--bg);z-index:49;color:var(--dim);
      font-size:13.5px}
#wait .dot{width:34px;height:34px;border-radius:17px;border:3px solid var(--line);
      border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#wait .dot{animation:none}}

#lock .box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
      border-radius:16px;padding:24px 20px;box-shadow:var(--shadow);text-align:center}
#lock h1{margin:0 0 4px;font-size:19px}
#lock p{margin:0 0 18px;color:var(--dim);font-size:13px}
#pw{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);text-align:center;letter-spacing:.1em}
#go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;
    background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
#go:disabled{opacity:.55}
#err{min-height:18px;margin-top:10px;color:var(--bad);font-size:13px}
.remember{margin-top:12px;color:var(--dim);font-size:13px;display:flex;
    align-items:center;justify-content:center;gap:6px}

/* ---------- 머리 ---------- */
header{position:sticky;top:0;z-index:20;background:var(--bg);
       padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top h1{margin:0;font-size:16px;font-weight:700;flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;
       padding:6px 9px;cursor:pointer;font-size:13px}
.searchwrap{position:relative;display:flex;align-items:center}
#q{width:100%;padding:12px 76px 12px 38px;border:1px solid var(--line);
   border-radius:12px;background:var(--card)}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mag{position:absolute;left:13px;color:var(--dim);pointer-events:none}
#hits{position:absolute;right:38px;color:var(--dim);font-size:12px;
      font-variant-numeric:tabular-nums;pointer-events:none}
#clr{position:absolute;right:8px;border:0;background:none;color:var(--dim);
     font-size:18px;cursor:pointer;padding:4px 6px;display:none}
.rows{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;
      padding-bottom:2px}
.rows::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border:1px solid var(--line);border-radius:999px;
      background:var(--card);color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tools{display:flex;gap:6px;margin-top:8px;align-items:center}
#sort,#view{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);
     border-radius:9px;background:var(--card)}

/* ---------- 요약 ---------- */
.sum{display:flex;gap:8px;padding:10px 12px 2px}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
         padding:9px 6px;text-align:center}
.sum b{display:block;font-size:16.5px;font-variant-numeric:tabular-nums;
       white-space:nowrap}
.sum span{font-size:11px;color:var(--dim)}

/* ---------- 목록 ---------- */
main{padding:10px 12px 28px;display:grid;gap:8px}
@media(min-width:720px){main{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){main{grid-template-columns:1fr 1fr 1fr}}
.item{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);
      border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.left{flex:0 0 68px;display:flex;flex-direction:column;gap:6px}
.thumb{width:68px;height:68px;border-radius:10px;background:var(--bg);
       object-fit:contain;cursor:zoom-in}
.goc{padding:6px 0;border:0;border-radius:9px;background:var(--accent);color:#fff;
       font-size:11.5px;font-weight:600;cursor:pointer}
.body{flex:1;min-width:0}
.nm{font-weight:600;line-height:1.35}
.nm mark{background:transparent;color:var(--accent);font-weight:700}
.sub{margin-top:2px;font-size:12px;color:var(--dim)}
.pr{display:flex;align-items:flex-end;gap:10px;margin-top:7px;flex-wrap:wrap}
.pr .g{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pr .c{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.badge{margin-left:auto;padding:4px 9px;border-radius:9px;font-size:13px;font-weight:700;
       font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
/* 퍼센트만으로는 얼마나 차이 나는지 감이 안 온다. 액수를 같이 적는다. */
.badge small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:1px}
.b-good{background:var(--good-bg);color:var(--good)}
.b-mid{background:var(--mid-bg);color:var(--mid)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-none{background:var(--bg);color:var(--dim);font-weight:600}
.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);
     border:1px solid var(--line);color:var(--dim)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:48px 12px}
footer{padding:18px 14px 34px;color:var(--dim);font-size:11.5px;text-align:center;line-height:1.7}

/* ---------- 사진 크게 ---------- */
/* 작은 그림은 화면에서 68px 이라 확대하면 답답하다. 폭을 꽉 채우되
   원본이 300px 이므로 거기까지만 키운다. 누르면 원본을 따로 받아 바꿔 끼운다. */
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;z-index:40;
      align-items:center;justify-content:center;padding:16px;flex-direction:column}
#zoom img{width:100%;max-width:440px;max-height:72vh;object-fit:contain;
      border-radius:14px;background:#fff;padding:10px}
#zoom p{margin:16px 0 0;text-align:center;color:#fff;font-size:14px;
        line-height:1.5;max-width:440px}
#zoom small{color:#b9bec6;font-size:12px;margin-top:8px}

/* ---------- 아래에서 올라오는 고르기 ---------- */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:45;
       align-items:flex-end;justify-content:center}
#sheet .box{position:relative;width:100%;max-width:460px;background:var(--card);
       border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));
       border:1px solid var(--line);border-bottom:0}
@media(min-width:520px){
  #sheet{align-items:center}
  #sheet .box{border-radius:18px;border-bottom:1px solid var(--line)}
}
#sheet h3{margin:0 0 3px;padding-right:34px;font-size:15px;line-height:1.4}
/* 닫기는 글로 적힌 줄보다 오른쪽 위 ✕ 가 눈에 빨리 들어온다.
   글자(✕)는 글꼴에 따라 기울어 보여서 두 획을 직접 긋는다. */
#sheet .x{position:absolute;top:9px;right:10px;padding:7px;line-height:0;
       cursor:pointer;user-select:none}
#sheet .x svg{width:17px;height:17px;display:block}
#sheet .x svg path{stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;
       fill:none;opacity:.75}
#sheet .x:hover svg path{opacity:1}
#sheet .note{margin:0 0 14px;color:var(--dim);font-size:12.5px}
#sheet button{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;
       padding:13px 16px;border-radius:11px;border:1px solid var(--line);
       background:var(--bg);font-size:14.5px;cursor:pointer;text-align:left}
#sheet .ico{flex:0 0 20px;width:20px;height:20px;line-height:0}
#sheet .ico svg{width:20px;height:20px;display:block}
#sheet .ico svg path{fill:none;stroke:var(--dim);stroke-width:1.7}
#sheet .ico.on svg path{fill:#ca210c;stroke:#ca210c}
/* 세 줄의 글자가 같은 자리에서 시작해야 눈이 편하다. 값 넣는 줄에는
   원화 표시를 같은 크기의 칸에 넣어 자리를 맞춘다. */
#sheet .ico.won{font-size:15.5px;font-weight:800;color:var(--dim);
       line-height:20px;text-align:center}
#sheet button.go{background:var(--accent);border-color:var(--accent);color:#fff;
       font-weight:600}
#sheet button.off{color:var(--dim)}
#cartbtn{position:relative;line-height:0;padding:7px 9px}
#cartbtn svg{width:17px;height:17px;display:block}
#cartbtn svg path{fill:#ca210c;stroke:#ca210c;stroke-width:1.5}
#cartn{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;
       border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;
       line-height:17px;text-align:center;display:none}
.cartrow{display:flex;gap:8px;align-items:center;padding:9px 2px;
       border-bottom:1px solid var(--line);font-size:13.5px}
.cartrow span{flex:1;min-width:0}
.cartrow b{font-variant-numeric:tabular-nums}
.cartrow i{color:var(--dim);font-style:normal;cursor:pointer;padding:0 6px}
.pricebox{display:flex;gap:8px;margin:12px 0 4px}
.pricebox input{flex:1;min-width:0;padding:13px;border:1px solid var(--line);
     border-radius:11px;background:var(--bg);font-size:16px;text-align:center}
.pricebox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pricebox label{flex:0 0 74px}
.tag-mine{background:var(--accent);border-color:var(--accent);color:#fff}
#inapp{display:none;margin:10px 12px 0;padding:12px 13px;border-radius:12px;
     background:var(--bad-bg);color:var(--bad);font-size:12.5px;line-height:1.65;
     border:1px solid var(--bad)}
#inapp b{display:block;margin-bottom:4px;font-size:13.5px}
#inapp .tip{display:block;margin-top:9px;padding-top:8px;color:var(--dim);
     border-top:1px solid var(--line)}
#inapp button{margin-top:8px;margin-right:6px;padding:7px 11px;border-radius:9px;
     border:1px solid var(--line);background:var(--card);color:var(--ink);
     font-size:12.5px;cursor:pointer}
#cartbar{display:none;gap:6px;padding:8px 12px 0}
#cartbar button{flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;
     background:var(--card);font-size:13px;cursor:pointer}
/* 카드에서 바로 눌러 쓰는 것 둘. 담겼는지는 별이 차 있는지로 안다. */
.item{position:relative;-webkit-touch-callout:none;user-select:none}
/* 찜하기는 하트다. 이모지(★)는 글꼴에 따라 기울어 보여서 직접 그린다.
   빈 하트는 테두리만, 담으면 쿠팡 빨강으로 채운다. */
.item .cart{position:absolute;top:5px;right:7px;padding:3px;cursor:pointer;
     line-height:0}
.item .cart svg{width:22px;height:22px;display:block}
.item .cart svg path{fill:none;stroke:var(--dim);stroke-width:1.7;opacity:.6}
.item .cart.on svg path{fill:#ca210c;stroke:#ca210c;opacity:1}
/* 쿠팡 앱 아이콘을 동그랗게 다듬어 넣었다. 글자로 적어 두었더니 눌린
   단추처럼 보여서 오해를 샀다. 그림은 페이지 안에 박아 두어 따로 받아
   오지 않는다(2KB 남짓). 카드와 고르기 메뉴가 같은 그림을 쓴다. */

/* 카드에서는 쿠팡 마크 대신 '밖으로 나간다' 는 화살표를 쓴다.

<body>

<div id="wait"><div class="dot"></div><div>여는 중…</div></div>

<div id="lock">
  <div class="box">
    <h1>&#128274;</h1>
    <p>비밀번호를 입력하세요</p>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password"
           placeholder="비밀번호" autofocus>
    <button id="go">열기</button>
    <label class="remember"><input id="keep" type="checkbox"> 이 기기에서 기억</label>
    <div id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="top">
      <h1 id="title"></h1>
      <button class="iconbtn" id="cartbtn" title="찜한 것"><span id="cartn"></span></button>
      <button class="iconbtn" id="more" title="옮기기·백업">⋯</button>
      <button class="iconbtn" id="theme" title="밝게/어둡게">◐</button>
    </div>
    <div class="searchwrap">
      <span class="mag">🔍</span>
      <input id="q" type="search" placeholder="검색" autocomplete="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <span id="hits"></span>
      <button id="clr" aria-label="지우기">×</button>
    </div>
    <div class="rows" id="chips"></div>
    <div class="tools">
      <select id="sort"></select>
      <select id="view"></select>
    </div>
  </header>

  <div id="inapp">
    <b id="inapptitle">카카오톡 브라우저에서는 쓰지 마세요</b>
    찜하기 연동 안 됩니다. 홈 화면 고정도 못 합니다.
    <div id="inappbtns"></div>
    <span class="tip">브라우저에서 연 뒤 메뉴 → <b style="display:inline">홈 화면에 추가</b>
    를 해 두면 앱처럼 바로 열리고, 넣은 값도 한곳에 쌓입니다.</span>
  </div>

  <div class="rows" id="cartbar">
    <button data-act="copyall">이름 전부 복사</button>
    <button data-act="clear">비우기</button>
  </div>

  <div class="sum">
    <div><b id="s1">–</b><span id="c1"></span></div>
    <div><b id="s2">–</b><span id="c2"></span></div>
    <div><b id="s3">–</b><span id="c3"></span></div>
  </div>

  <main id="list"></main>

  <footer id="foot"></footer>
</div>

<div id="zoom"><img alt=""><p></p><small>아무 데나 누르면 닫힙니다</small></div>

<div id="sheet"><div class="box" id="sheetbox"></div></div>

<script>
/* ============================ 잠금 풀기 ============================ */
const KEY_NAME = "gmpx-key";
const $ = s => document.querySelector(s);

async function derive(pw, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
                                             "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}

let KEY = null;

async function unlock(pw, remember){
  const buf = await (await fetch("data.bin", {cache:"no-cache"})).arrayBuffer();
  const raw = new Uint8Array(buf);
  const salt = raw.slice(5, 21), iv = raw.slice(21, 33), body = raw.slice(33);
  KEY = await derive(pw, salt);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, KEY, body);
  const data = JSON.parse(new TextDecoder().decode(plain));
  if (remember) { try { localStorage.setItem(KEY_NAME, pw); } catch(e){} }
  else { try { sessionStorage.setItem(KEY_NAME, pw); } catch(e){} }
  return data;
}

/* 사진은 목록이 뜬 뒤에 받는다. 전 품목이면 8MB 가 넘어서, 같이 기다리면
   폰에서는 흰 화면만 한참 본다. 실패해도 목록은 멀쩡해야 하므로 조용히 넘어간다. */
async function loadPics(){
  try {
    const raw = new Uint8Array(await (await fetch("pics.bin", {cache:"no-cache"})).arrayBuffer());
    const plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv: raw.slice(5, 17)}, KEY, raw.slice(17));
    PICS = JSON.parse(new TextDecoder().decode(plain));
    for (const el of document.querySelectorAll("img.thumb:not([src])")) paint(el);
  } catch (e) { /* 사진 없이 그냥 쓴다 */ }
}
function paint(el){
  const b = PICS[el.dataset.p];
  if (b) el.src = "data:image/jpeg;base64," + b;
}

$("#go").addEventListener("click", async () => {
  const pw = $("#pw").value;
  if (!pw) return;
  $("#go").disabled = true; $("#err").textContent = "여는 중…";
  try { start(await unlock(pw, $("#keep").checked)); }
  catch (e) { $("#err").textContent = "비밀번호가 다릅니다"; $("#pw").select(); }
  finally { if ($("#go")) $("#go").disabled = false; }
});
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });

/* 비밀번호를 기억해 둔 기기에서는 **잠금 화면을 아예 안 보여 준다.**
 *
 * 자료를 받아 풀기까지 0.7초쯤 걸리는데, 그동안 잠금 화면이 떠 있다가
 * 사라졌다. 쿠팡으로 넘어갈 때처럼 페이지가 다시 열리는 순간마다 비밀번호
 * 창이 번쩍여서, 마치 로그인이 풀린 것처럼 보였다.
 *
 * 열쇠가 있으면 곧 열릴 것이 확실하니 빈 화면으로 기다린다.
 * 풀지 못했을 때만 잠금 화면을 도로 내놓는다. */
(async function auto(){
  let pw = null;
  try { pw = localStorage.getItem(KEY_NAME) || sessionStorage.getItem(KEY_NAME); } catch(e){}
  if (!pw) return;
  const lock = $("#lock");
  if (lock) lock.style.visibility = "hidden";
  $("#wait").style.display = "flex";
  try { start(await unlock(pw, true)); }
  catch(e){
    try{ localStorage.removeItem(KEY_NAME); sessionStorage.removeItem(KEY_NAME);}catch(_){}
    if (lock) lock.style.visibility = "visible";
  }
  $("#wait").style.display = "none";
})();

/* ============================ 한글 찾기 ============================ */
/* '참' 만 쳐도, '참ㄱ' 까지 쳐도, 'ㅊㄱㄹ' 로도 걸리게 한다.
   한글을 자모로 풀어 두고 이어 붙인 뒤 통째로 포함되는지만 본다.      */
const CHO  = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG = "␀ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ";

function toJamo(s){
  let out = "";
  for (const ch of s){
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3){
      const i = c - 0xAC00;
      out += CHO[(i / 588) | 0] + JUNG[((i % 588) / 28) | 0];
      const j = i % 28; if (j) out += JONG[j];
    } else out += ch;
  }
  return out;
}
function toCho(s){
  let out = "";
  for (const ch of s){
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) out += CHO[((c - 0xAC00) / 588) | 0];
    else if (CHO.includes(ch)) out += ch;
    else if (/[0-9a-z]/i.test(ch)) out += ch.toLowerCase();
  }
  return out;
}
const CHO_ONLY = /^[ㄱ-ㅎ0-9a-z]+$/i;
const noSpace = s => toJamo(String(s).replace(/\s+/g, ""));

/* ============================ 화면 ============================ */
let DATA = [], VIEW = [], BIG = "전체", SHOWN = 0, CP = "", WAIT = "", PICS = {};
const won = n => n == null ? "–" : n.toLocaleString("ko-KR") + "원";
const pct = n => (n > 0 ? "+" : "") + n.toFixed(1) + "%";
/* 군마트가 싸면 음수다. 기준이 쿠팡가이기 때문(프로그램의 calc() 과 같다). */
const wonDiff = n => (n > 0 ? "+" : "") + n.toLocaleString("ko-KR") + "원";

function start(d){
  // 페이지를 열기 전에는 제목조차 알 수 없어야 한다. 잠긴 자료에서 꺼내 온다.
  DATA = d.items;
  document.title = d.title;
  $("#title").textContent = d.title;
  $("#foot").innerHTML = d.foot;
  $("#q").placeholder = d.hint;
  CP = d.cp;
  $("#sort").innerHTML = d.sorts.map(o =>
      '<option value="' + o[0] + '">' + o[1] + "</option>").join("");
  $("#view").innerHTML = d.views.map(o =>
      '<option value="' + o[0] + '">' + o[1] + "</option>").join("");
  WAIT = d.wait;
  for (let i = 0; i < 3; i++) $("#c" + (i + 1)).textContent = d.caps[i];
  // 본문(이름·업체·규격)과 곁들이(분류·상품코드·다른 말)를 따로 둔다.
  // 둘 다 뒤지되, 본문에 맞은 것을 위로 올린다.
  //
  //   '오일' 로 찾으면 중분류가 '오일/소스/양념' 인 것이 120건 걸린다.
  //   정작 이름이 '올리브오일' 인 것이 그 사이에 파묻혀 있었다.
  for (const it of DATA){
    const all = it.hb + " " + it.hx;
    it._b = noSpace(it.hb);   it._x = noSpace(all);
    it._cb = toCho(it.hb);    it._cx = toCho(all);
  }
  applyMine();
  const bigs = ["전체", ...d.bigs];
  setTimeout(markMine, 0);
  $("#chips").innerHTML = bigs.map(b =>
    '<button class="chip' + (b === "전체" ? " on" : "") + '" data-b="' + b + '">' +
    b + "</button>").join("");
  $("#chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    BIG = b.dataset.b;
    $("#chips").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
    runFresh();
  });
  $("#lock").remove();
  $("#app").hidden = false;
  // 주소 뒤에 짐이 실려 왔으면 먼저 푼다
  const raw = location.hash.slice(1);
  if (raw === "noapp"){
    try { history.replaceState({}, "", location.pathname); } catch(e){}
    setTimeout(openNoApp, 400);
  } else if (raw.indexOf("import=") === 0){
    let msg = "가져오지 못했습니다";
    try {
      const [a, m] = unpack(raw.slice(7));
      msg = "가져왔습니다 — 찜 " + a + "건, 넣은 값 " + m + "건";
    } catch (e) {}
    try { history.replaceState({}, "", location.pathname); } catch(e){}
    setTimeout(() => alert(msg), 300);
  } else {
    const h = decodeURIComponent(raw);
    if (h) $("#q").value = h;
  }
  // 쿠팡에 다녀온 뒤라면 보던 자리로 되돌린다
  let back = null;
  try {
    back = JSON.parse(sessionStorage.getItem(STATE_KEY) || "null");
    sessionStorage.removeItem(STATE_KEY);
  } catch(e){}
  if (back){
    $("#q").value = back.q || "";
    BIG = back.big || "전체";
    $("#chips").querySelectorAll(".chip").forEach(
        c => c.classList.toggle("on", c.dataset.b === BIG));
    $("#view").value = back.view || "all";
    $("#sort").value = back.sort || "rate";
  }
  run();
  if (back && back.y){
    // 60개씩 그리므로, 보던 높이까지 먼저 채운 뒤에 내려야 한다
    let guard = 0;
    while (document.body.offsetHeight < back.y + innerHeight && SHOWN < VIEW.length
           && guard++ < 80) more();
    window.scrollTo(0, back.y);
  } else {
    $("#q").focus({preventScroll:true});
  }
  loadPics();
}

$("#theme").addEventListener("click", () => {

});
try {

  if (t) document.documentElement.setAttribute("data-theme", t);
} catch(e){}

function run(){
  const raw = $("#q").value.trim();
  $("#clr").style.display = raw ? "block" : "none";
  try {
    history.replaceState(history.state, "", raw ? "#" + encodeURIComponent(raw) : " ");
  } catch(e){}

  const toks = raw.split(/\s+/).filter(Boolean).map(t => ({
    j: noSpace(t.toLowerCase()),
    c: toCho(t),
    cho: CHO_ONLY.test(t) && !/[가-힣]/.test(t)
  }));

  const view = $("#view").value || "all";
  VIEW = DATA.filter(it => {
    if (BIG !== "전체" && it.big !== BIG) return false;
    // 찜한 것 보기는 빼고(거기서 빼면 바로 사라지는 게 맞다),
    // 나머지 보기에서는 방금 손댄 줄을 남겨 둔다.
    if (view !== "cart" && !KEEP.has(it.p)){
      if (view === "done" && it.rate == null) return false;
      if (view === "none" && !it.nm) return false;
      if (view === "wait" && (it.rate != null || it.nm)) return false;
      if (view === "mine" && !it.mine) return false;
    }
    if (view === "cart" && !inCart(it.p)) return false;
    let score = 0;
    for (const t of toks){
      const inBody = t.cho ? it._cb.includes(t.c) : it._b.includes(t.j);
      const inAll  = t.cho ? it._cx.includes(t.c) : it._x.includes(t.j);
      if (!inBody && !inAll) return false;
      score += inBody ? 2 : 1;          // 이름에 맞으면 두 배로 친다
    }
    it._s = score;
    return true;
  });

  const k = $("#sort").value;
  const big = 1e12;
  VIEW.sort((a, b) => {
    if (toks.length && b._s !== a._s) return b._s - a._s;   // 잘 맞은 것 먼저
    const A = a.rate == null ? big : a.rate, B = b.rate == null ? big : b.rate;
    switch (k){
      case "rate":    return A - B;
      case "rate_up": return (a.rate == null ? -big : -a.rate) - (b.rate == null ? -big : -b.rate);
      case "diff":    return (a.diff == null ? big : a.diff) - (b.diff == null ? big : b.diff);
      case "gm_dn":   return b.g - a.g;
      case "gm_up":   return a.g - b.g;
      default:        return a.no - b.no;
    }
  });

  const bar = $("#cartbar");
  bar.style.display = (view === "cart" || view === "mine") ? "flex" : "none";
  bar.dataset.mode = view;
  bar.children[0].textContent = view === "mine" ? "프로그램에 넣을 글 복사"
                                                : "이름 전부 복사";
  bar.children[1].textContent = view === "mine" ? "넣은 값 모두 지우기" : "비우기";
  stats();

  SHOWN = 0;
  $("#list").innerHTML = "";
  if (!VIEW.length){
    $("#list").innerHTML = '<div class="empty">찾는 것이 없습니다</div>';
    return;
  }
  more();
}

function median(a){
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
/* 요약 세 칸. 목록을 다시 그리지 않고 숫자만 고칠 때도 쓴다. */
function stats(){
  $("#hits").textContent = VIEW.length.toLocaleString("ko-KR") + "건";
  // 값이 들어 있는 줄만으로 센다. 안 본 줄을 섞으면 숫자가 거짓이 된다.
  const done = VIEW.filter(i => i.rate != null);
  $("#s1").textContent = done.length.toLocaleString("ko-KR") + " / "
      + VIEW.length.toLocaleString("ko-KR");
  // 아낀 돈 = 쿠팡 낱개가와 군마트가의 차이를 다 더한 것.
  // 군마트가 비싼 줄은 저절로 깎이므로 부풀려지지 않는다.
  const saved = done.reduce((a, i) => a + (i.c - i.g), 0);
  $("#s2").textContent = done.length ? won(saved) : "–";
  $("#s3").textContent = done.length
      ? Math.round(100 * done.filter(i => i.rate < 0).length / done.length) + "%" : "–";
}

/* 값을 넣은 그 줄만 다시 그린다.
 *
 * `아직 안 본 것` 으로 걸러 놓고 값을 넣으면, 목록을 다시 거르는 순간 그
 * 줄이 조건에서 벗어나 눈앞에서 사라진다. 얼마나 싼지 확인할 새가 없다.
 * 그래서 거르지도 줄 세우지도 않고 그 칸만 갈아 끼운다. 자리도 그대로다.
 * 다음에 검색어·분류·보기를 건드리면 그때 정리된다.
 */
function refreshCard(p){
  const it = DATA.find(x => x.p === p);
  const el = document.querySelector('.item[data-p="' + p + '"]');
  if (!it || !el) return run();
  el.outerHTML = card(it, $("#q").value.trim());
  stats();
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hi(name, raw){
  const safe = esc(name);
  if (!raw) return safe;
  let out = safe;
  for (const t of raw.split(/\s+/).filter(Boolean)){
    const e = esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (e) out = out.replace(new RegExp(e, "gi"), m => "<mark>" + m + "</mark>");
  }
  return out;
}

function card(it, raw){
  // 아직 안 본 줄이 2,000건 넘게 섞여 있다. rate 가 null 인 채로 pct() 에
  // 넘기면 그 자리에서 죽는다. 등급도 값도 없으면 회색으로만 둔다.
  const cls = (it.nm || it.rate == null) ? "b-none"
            : it.rate < 0 ? "b-good"
            : it.rate === 0 ? "b-mid" : "b-bad";
  // 아랫줄(차액)은 값이 없어도 자리를 비워 둔다. 값을 넣는 순간 줄이 하나
  // 늘어나면 카드가 17px 커지고, 아래 있던 것들이 그만큼 밀려 내려간다.
  // 보던 자리가 흔들리는 것보다 빈 줄이 낫다.
  const badge = (it.nm ? "비교군 없음" : it.rate == null ? WAIT : pct(it.rate)) +
      "<small>" + (it.rate == null ? "&nbsp;" : wonDiff(it.diff)) + "</small>";
  const tags = [];
  if (it.conv) tags.push('<span class="tag" title="' + esc(it.conv) + '">환산</span>');
  if (it.mine) tags.push('<span class="tag tag-mine">폰에서 넣음</span>');
  if (it.q > 1) tags.push('<span class="tag">' + it.q + "개들이에서 낱개</span>");
  if (it.sub) tags.push('<span class="tag">' + esc(it.sub) + "</span>");
  const b = PICS[it.p];
  const img = '<img class="thumb" loading="lazy" alt="" data-p="' + it.p +
      '" data-nm="' + esc(it.name) + '"' +
      (b ? ' src="data:image/jpeg;base64,' + b + '"' : "") + ">";
  // 찜한 것 보기에서는 사진 아래에 쿠팡으로 바로 가는 단추를 둔다.
  // 담아 둔 것을 하나씩 확인하러 갈 때 메뉴를 거치지 않아도 된다.
  const left = '<div class="left">' + img +
      ($("#view").value === "cart" ? '<button class="goc">쿠팡이동</button>' : "") +
      "</div>";
  return '<article class="item" data-p="' + it.p + '">' +
    '<i class="cpg" title="쿠팡에서 보기">' + OUT + "</i>" +
    '<i class="cart' + (inCart(it.p) ? " on" : "") + '" title="찜하기">' +
      HEART + "</i>" + left +
    '<div class="body"><div class="nm">' + hi(it.name, raw) + "</div>" +
    '<div class="sub">' + esc(it.spec || "") + (it.spec && it.maker ? " · " : "") +
      esc(it.maker || "") + "</div>" +
    '<div class="pr"><span class="g">' + won(it.g) + "</span>" +
      (it.c == null ? "" : '<span class="c">' + CP + " " + won(it.c) + "</span>") +
      '<span class="badge ' + cls + '">' + badge + "</span></div>" +
    (tags.length ? '<div class="tags">' + tags.join("") + "</div>" : "") +
    "</div></article>";
}

function more(){

/* ========================= 사진 크게 보기 ========================= */
/* 작은 그림을 먼저 띄워 기다림이 없게 하고, 원본이 오면 조용히 바꿔 끼운다. */
const BIGPIC = {};
async function showBig(p){
  if (BIGPIC[p]) { $("#zoom img").src = BIGPIC[p]; return; }
  try {
    const raw = new Uint8Array(await (await fetch("big/" + p + ".bin")).arrayBuffer());
    const plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv: raw.slice(5, 17)}, KEY, raw.slice(17));
    BIGPIC[p] = URL.createObjectURL(new Blob([plain], {type:"image/jpeg"}));
    if ($("#zoom").style.display === "flex") $("#zoom img").src = BIGPIC[p];
  } catch (e) { /* 작은 그림 그대로 둔다 */ }
}

/* ================== 다른 주소로 옮기기 · 백업 ==================
 *
 * 찜한 것과 넣은 값은 **주소마다 따로** 쌓인다. 브라우저가 그렇게 막아 둔
 * 것이라 `gunmart.netlify.app` 으로 옮기면 `demanico1.github.io` 것이
 * 안 보인다. 우회할 수 있는 성질이 아니다.
 *
 * 대신 통째로 싸서 옮기는 길을 낸다. 짐을 주소 뒤에 실어 보내고, 받는 쪽이
 * 열리자마자 풀어 넣는다. 브라우저를 갈아탈 때도, 실수로 사이트 데이터를
 * 지웠을 때도 같은 길로 되살린다.
 */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let out = "";
  for (let i = 0; i < bytes.length; i += 4096)
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
  return btoa(out).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64dec(t){
  const raw = atob(t.replace(/-/g, "+").replace(/_/g, "/"));
  return new TextDecoder().decode(
      Uint8Array.from(raw, c => c.charCodeAt(0)));
}
function packed(){
  return b64enc(JSON.stringify({v: 1, c: CART, m: MINE}));
}
function unpack(text){
  const t = String(text || "").trim();
  const at = t.indexOf("#import=");
  const data = JSON.parse(b64dec(at >= 0 ? t.slice(at + 8) : t));
  if (!data || data.v !== 1) throw new Error("모양이 다릅니다");
  // 두 번 가져와도 겹치지 않게 넣고, 알릴 때는 '받은 짐' 전체를 센다.
  // 이미 있던 것만 들어왔을 때 '0건' 이라고 하면 실패한 줄 안다.
  for (const p of (data.c || [])) if (!inCart(p)) CART.push(p);
  for (const p of Object.keys(data.m || {})) MINE[p] = data.m[p];
  saveCart(); saveMine();
  return [(data.c || []).length, Object.keys(data.m || {}).length];
}

function openMove(){
  const n1 = CART.length, n2 = Object.keys(MINE).length;
  openSheet("<h3>옮기기 · 백업</h3>" +
    '<p class="note">찜한 것 ' + n1 + "건 · 넣은 값 " + n2 + "건<br>" +
    "주소가 바뀌면 저장한 것이 따라오지 않습니다. 링크로 옮기세요.</p>" +
    '<button class="go" data-act="movelink">옮길 링크 복사</button>' +
    '<button data-act="movein">붙여넣어 가져오기</button>' +
    '<button data-act="noapp">쿠팡이 안 열릴 때</button>');
}
$("#more").addEventListener("click", openMove);

/* 이미 이 페이지를 보고 있는데 주소창에 옮길 링크를 붙여 넣으면 `#` 뒤만
   바뀐다. 그때는 페이지가 다시 열리지 않아 아래 풀어 넣는 자리를 지나치지
   않는다. 그래서 주소가 바뀌는 것도 따로 지켜본다. */
addEventListener("hashchange", () => {
  const raw = location.hash.slice(1);
  if (raw.indexOf("import=") !== 0) return;
  let msg = "가져오지 못했습니다";
  try {
    const [a, m] = unpack(raw.slice(7));
    msg = "가져왔습니다 — 찜 " + a + "건, 넣은 값 " + m + "건";
    run();
  } catch (e) {}
  try { history.replaceState({}, "", location.pathname); } catch(e){}
  alert(msg);
});

/* ========================= 찜하기 ========================= */
/* 폰으로 보다가 '이건 쿠팡에서 확인해 보자' 싶은 것을 담아 두는 곳이다.
   이 기기의 브라우저에만 남는다. 지우면 사라진다. */
/* 하트 하나를 만들어 두고 카드마다 같은 것을 쓴다. */
/* 밖으로 나가는 화살표. 링크가 이 페이지를 떠난다는 뜻으로 널리 쓰인다. */
const OUT = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
  '<path d="M14 5h5v5M19 5l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8' +
  'a2 2 0 0 1 2-2h4"/></svg>';

const XMARK = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
  '<path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg>';

const HEART = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
  '<path d="M12 20.4C6.6 16.5 3 13.1 3 9.4 3 6.8 5 4.9 7.5 4.9c1.7 0 3.3.9 ' +
  '4.5 2.4C13.2 5.8 14.8 4.9 16.5 4.9 19 4.9 21 6.8 21 9.4c0 3.7-3.6 7.1-9 11z" ' +
  'stroke-linejoin="round"/></svg>';

const CART_KEY = "gmpx-cart";
let CART = [];
try {
  // 예전에는 {p, name, g} 를 통째로 담았다. 상품코드만 남기고 나머지는
  // 그릴 때 원래 줄에서 가져온다. 그래야 사진도 값도 목록과 똑같이 나온다.
  CART = (JSON.parse(localStorage.getItem(CART_KEY) || "[]") || [])
      .map(x => (x && x.p) ? x.p : x).filter(Boolean);
} catch(e){}

function inCart(p){ return CART.indexOf(p) >= 0; }

/* ===================== 폰에서 넣은 값 =====================
   서버가 없으므로 이 기기의 브라우저에만 쌓인다. 화면에는 바로 반영되고,
   나중에 한 번 복사해서 프로그램의 `여러 건 넣기`(Ctrl+B)에 붙이면 DB 로 간다. */
/* 방금 값을 넣은 줄은 보기 조건에서 벗어나도 남겨 둔다.
 *
 * `아직 안 본 것` 으로 걸러 놓고 값을 넣으면 그 줄은 더 이상 '안 본 것' 이
 * 아니다. 거르는 순간 눈앞에서 사라져 얼마나 싼지 볼 새가 없다.
 * 그 칸만 갈아 끼우는 것으로는 부족했다 — 쿠팡에 다녀오면 목록을 처음부터
 * 다시 그리므로 그때 사라졌다. 그래서 **어느 줄을 남겨 둘지 따로 적어 둔다.**
 *
 * sessionStorage 에 두는 이유가 있다. 쿠팡에 다녀오는 동안 살아남아야 하고,
 * 창을 닫으면 없어지는 게 맞다. 검색어·분류·보기를 건드리면 그때 비운다.
 */
const KEEP_KEY = "gmpx-keep";
let KEEP = new Set();
try { KEEP = new Set(JSON.parse(sessionStorage.getItem(KEEP_KEY) || "[]")); } catch(e){}

function keepAdd(p){
  KEEP.add(p);
  try { sessionStorage.setItem(KEEP_KEY, JSON.stringify([...KEEP])); } catch(e){}
}
function keepClear(){
  KEEP.clear();
  try { sessionStorage.removeItem(KEEP_KEY); } catch(e){}
}
/* 목록을 처음부터 다시 볼 때. 남겨 둔 것을 비우고 그린다. */
function runFresh(){ keepClear(); run(); }

const MINE_KEY = "gmpx-mine";
let MINE = {};
try { MINE = JSON.parse(localStorage.getItem(MINE_KEY) || "{}") || {}; } catch(e){}

function saveMine(){
  try { localStorage.setItem(MINE_KEY, JSON.stringify(MINE)); } catch(e){}
  applyMine();
  markMine();
}

/* 폰에 쌓인 것은 이 브라우저에만 있다. 프로그램으로 옮기기 전까지는
   몇 건이 기다리고 있는지 눈에 보여야 잊지 않는다. */
function markMine(){
  const n = Object.keys(MINE).length;
  const opt = $("#view").querySelector('option[value="mine"]');
  if (opt) opt.textContent = n ? "폰에서 넣은 것 " + n + "건" : "폰에서 넣은 것";
}

/* 넣은 값을 줄에 덮어씌운다. 원래 값은 c0·r0… 에 따로 둬서 지우면 되돌아간다.
   셈은 프로그램의 calc() 과 똑같다 — 낱개 = 금액 ÷ 수량, 할인율은 쿠팡 기준. */
function applyMine(){
  for (const it of DATA){
    if (it.c0 === undefined){
      it.c0 = it.c; it.r0 = it.rate; it.d0 = it.diff; it.q0 = it.q; it.n0 = it.nm;
    }
    const m = MINE[it.p];
    if (!m){
      it.c = it.c0; it.rate = it.r0; it.diff = it.d0;
      it.q = it.q0; it.nm = it.n0; it.mine = 0;
      continue;
    }
    it.mine = 1;
    if (m.nm){ it.c = null; it.rate = null; it.diff = null; it.nm = 1; continue; }
    it.nm = 0;
    it.q = m.q || 1;
    it.c = Math.round(m.c / it.q);
    it.diff = it.c ? it.g - it.c : null;
    it.rate = it.c ? Math.round((it.g - it.c) / it.c * 1000) / 10 : null;
  }
}

/* 프로그램의 `여러 건 넣기` 가 그대로 알아듣는 글로 만든다. */
function mineText(){
  return Object.keys(MINE).map(p => {
    const m = MINE[p];
    return m.nm ? p + ", 없음" : p + ", " + m.c + ", " + (m.q || 1);
  }).join("\n");
}
function saveCart(){
  try { localStorage.setItem(CART_KEY, JSON.stringify(CART)); } catch(e){}
  const n = $("#cartn");
  n.textContent = CART.length;
  n.style.display = CART.length ? "block" : "none";
}
/* 쿠팡은 **같은 창에서** 연다.
   새 탭으로 띄우면 폰에서 뒤로가기를 눌러도 이 목록으로 안 돌아온다.
   돌아올 때를 대비해 보고 있던 자리를 적어 둔다. 브라우저가 화면을
   통째로 기억해 두면(bfcache) 이건 쓰이지 않고, 아니면 이걸로 되살린다. */
const STATE_KEY = "gmpx-state";
/* 파트너스 링크가 있으면 그걸로 간다(`it.a`). 없으면 평범한 검색 주소로.
   링크는 구울 때 PC 에서 만들어 잠긴 자료에 넣어 둔 것이다 — 키는 여기 없다.

   **같은 창에서 간다.** 새 창으로도 해 봤지만 사장님이 같은 창을 골랐다.
   브라우저에 머무는 경우에는 뒤로가기 한 번으로 보던 자리에 돌아온다.
   폰에서 앱이 열리면 그 창을 앱이 가져가므로 돌아올 곳이 없어지는데,
   브라우저를 다시 열고 주소를 열면 적어 둔 자리로 되살아난다.

   틀(iframe) 안에 쿠팡을 띄우는 건 안 된다. 쿠키가 안 따라 들어가서
   '사용권한이 없습니다' 가 뜬다. 홈을 먼저 거쳐도 마찬가지였다. */
/* 앱이 깔려 있는지 물어보는 단계를 뒀다가 걷어냈다.
 *
 * 그 장치가 쓸모 있는 경우는 '앱도 없고 + 그 브라우저로 쿠팡이 처음' 인
 * 사람뿐인데, 그러자고 모두에게 탭을 한 번 더 시켰다. 게다가 오류를
 * 만나도 ⋯ 의 '쿠팡이 안 열릴 때' 로 스스로 고칠 수 있다.
 * 드문 경우를 막으려고 늘 쓰는 길을 불편하게 만들면 안 된다. */
function coupang(name, link){
  hideOverlays();                       // 덮개는 그냥 감춘다 (뒤로가기 말고)
  try { history.replaceState({}, ""); } catch(e){}   // 덮개 발자국을 지운다
  try {
    sessionStorage.setItem(STATE_KEY, JSON.stringify({
      q: $("#q").value, big: BIG, view: $("#view").value,
      sort: $("#sort").value, y: window.scrollY,
    }));
  } catch(e){}
  const url = link || ("https://www.coupang.com/np/search?q="
                       + encodeURIComponent(name));

  /* `intent://` 로 앱을 지목해 보냈더니 **앱이 깔려 있는데도** 안내 화면으로
     떨어졌다. 쿠팡 앱이 그 모양의 주소를 안 받는 것이다. 폰에서 확인하고
     되돌렸다. 평범한 주소로 보내면 안드로이드가 알아서 앱을 띄운다.

     앱이 없는 사람은 ⋯ 메뉴의 '쿠팡이 안 열릴 때' 로 안내를 볼 수 있다. */
  location.href = url;
}

/* 앱이 없어 되돌아왔을 때. 쿠키만 생기면 웹으로도 멀쩡히 보이므로
   '쿠팡 홈 한 번 열기' 가 사실상의 해결책이다. */
function openNoApp(){
  openSheet("<h3>쿠팡 앱이 없습니다</h3>" +
    '<p class="note">앱이 없으면 쿠팡 웹으로 가는데, 이 브라우저로 쿠팡이 ' +
    "처음이면 <b>사용권한이 없습니다</b> 가 뜹니다.<br>" +
    "아래 둘 중 하나만 하면 그다음부터 괜찮습니다.</p>" +
    '<button class="go" data-act="cpghome">쿠팡 홈 한 번 열기</button>' +
    '<button data-act="cpginstall">쿠팡 앱 설치하기</button>');
}

/* 폰의 뒤로가기는 덮개(확대·고르기)가 떠 있으면 **그것만** 닫아야 한다.
   그냥 두면 페이지를 통째로 떠나 버려서 보던 목록이 사라진다.
   덮개를 열 때 발자국을 하나 남기고, 뒤로가기가 오면 그걸 닫는 데 쓴다. */
function markOverlay(){
  if (!(history.state && history.state.ov)) {
    try { history.pushState({ov:1}, ""); } catch(e){}
  }
}
function hideOverlays(){
  $("#zoom").style.display = "none";
  $("#sheet").style.display = "none";
}
function dismiss(){
  if (history.state && history.state.ov) history.back();   // popstate 가 닫는다
  else hideOverlays();
}
addEventListener("popstate", () => {
  const open = $("#zoom").style.display === "flex"
            || $("#sheet").style.display === "flex";
  hideOverlays();
  if (!open && $("#view").value === "cart") restorePrev();
});

function openSheet(html){
  $("#sheetbox").innerHTML =
      '<i class="x" data-act="close">' + XMARK + "</i>" + html;
  $("#sheet").style.display = "flex";
  markOverlay();
}
function closeSheet(){ dismiss(); }

$("#sheet").addEventListener("click", e => {
  if (e.target.id === "sheet") closeSheet();
  const b = e.target.closest("button, .x"); if (!b) return;
  const p = b.dataset.p, act = b.dataset.act;
  if (act === "close") return closeSheet();
  // 여기서 closeSheet() 를 부르면 안 된다. 그건 history.back() 이라서
  // 방금 시킨 쿠팡 이동을 취소해 버린다. 실제로 그래서 안 넘어갔다.
  if (act === "coupang"){
    const it = DATA.find(x => x.p === b.dataset.p);
    return coupang(b.dataset.q, it && it.a);
  }
  if (act === "add"){ CART.push(p); saveCart(); closeSheet(); return run(); }
  if (act === "del"){
    CART = CART.filter(x => x !== p);
    saveCart(); closeSheet(); return run();
  }
  if (act === "noapp") return openNoApp();
  if (act === "cpghome"){ location.href = "https://www.coupang.com/"; return; }
  if (act === "cpginstall"){
    location.href = IOS
      ? "https://apps.apple.com/kr/app/id454434967"
      : "https://play.google.com/store/apps/details?id=com.coupang.mobile";
    return;
  }
  if (act === "movelink"){
    const url = location.origin + location.pathname + "#import=" + packed();
    try { navigator.clipboard.writeText(url); } catch(e){}
    b.textContent = "복사했습니다 — 새 주소에서 여세요";
    return;
  }
  if (act === "movein"){
    const t = prompt("옮길 링크나 글을 붙여 넣으세요");
    if (!t) return;
    try {
      const [a, m] = unpack(t);
      closeSheet(); run();
      alert("가져왔습니다 — 찜 " + a + "건, 넣은 값 " + m + "건");
    } catch (e) { alert("읽지 못했습니다. 링크를 통째로 붙여 넣어 주세요."); }
    return;
  }
  if (act === "price") return openPrice(p);
  if (act === "save"){
    const c = parseInt(($("#pin").value || "").replace(/[^0-9]/g, ""), 10);
    const q = Math.max(1, parseInt($("#qin").value, 10) || 1);   // 비우면 1
    if (!c) { $("#pin").focus(); return; }
    MINE[p] = {c, q}; keepAdd(p); saveMine(); closeSheet(); return refreshCard(p);
  }
  if (act === "nomatch"){
    MINE[p] = {nm:1}; keepAdd(p); saveMine(); closeSheet(); return refreshCard(p);
  }
  if (act === "unset"){
    delete MINE[p]; keepAdd(p); saveMine(); closeSheet(); return refreshCard(p);
  }
});

/* 찜한 것은 따로 만든 창이 아니라 **목록의 한 보기**다. 그래야 사진도
   값도 할인율도 목록에서 보던 그대로 나온다. 검색·정렬도 그대로 듣는다. */
/* 자리는 우리가 되돌린다. 이걸 끄지 않으면 뒤로가기 때 브라우저가 제
   기록대로 스크롤을 다시 맞춰 버려서, 우리가 옮겨 놓은 자리가 0 으로 덮인다. */
try { history.scrollRestoration = "manual"; } catch(e){}

/* 찜한 것을 열면 보던 화면을 적어 둔다. 하트를 한 번 더 누르거나 폰
   뒤로가기를 누르면 그 자리로 되돌아온다. 잠깐 들렀다 오는 곳이라서다. */
let PREV = null;

function fillTo(y){
  let guard = 0;
  while (document.body.offsetHeight < y + innerHeight
         && SHOWN < VIEW.length && guard++ < 80) more();
}

function backFromCart(){
  if (history.state && history.state.cart) return history.back();  // popstate 가 되돌린다
  restorePrev();
}

function restorePrev(){
  const p = PREV; PREV = null;
  $("#q").value = p ? p.q : "";
  BIG = p ? p.big : "전체";
  $("#chips").querySelectorAll(".chip").forEach(
      c => c.classList.toggle("on", c.dataset.b === BIG));
  $("#view").value = p ? p.view : "all";
  $("#sort").value = p ? p.sort : "rate";
  run();
  if (p && p.y){
    fillTo(p.y);
    scrollTo(0, p.y);
    setTimeout(() => scrollTo(0, p.y), 60);   // 그림이 실리며 높이가 변할 때를 대비
  }
}

function openCart(){
  if ($("#view").value === "cart") return backFromCart();   // 한 번 더 누르면 되돌아간다
  if (!CART.length){
    return openSheet('<h3>찜한 것이 없습니다</h3>' +
      '<p class="note">하트를 누르면 여기 모입니다.</p>');
  }
  PREV = {q: $("#q").value, big: BIG, view: $("#view").value,
          sort: $("#sort").value, y: window.scrollY};
  $("#view").value = "cart";
  $("#q").value = "";
  BIG = "전체";
  $("#chips").querySelectorAll(".chip").forEach(
      c => c.classList.toggle("on", c.dataset.b === "전체"));
  run();
  scrollTo(0, 0);
  try { history.pushState({cart:1}, ""); } catch(e){}
}
/* 쿠팡에서 값을 보고 온 참에 바로 넣는 자리. 두 칸이면 충분하다. */
function openPrice(p){
  const it = DATA.find(x => x.p === p); if (!it) return;
  const m = MINE[p] || {};
  openSheet("<h3>" + esc(it.name) + "</h3>" +
    '<p class="note">군마트 ' + won(it.g) + " · " + CP + "에 적힌 금액을 그대로</p>" +
    '<div class="pricebox">' +
      '<input id="pin" type="number" inputmode="numeric" placeholder="' + CP +
        ' 금액" value="' + (m.c || "") + '">' +
      '<input id="qin" class="qty" type="number" inputmode="numeric" ' +
        'placeholder="수량 1" value="' + (m.q > 1 ? m.q : "") + '">' +
    "</div>" +
    '<p class="note">2개 9,800원이면 9800 과 2 를 넣으세요</p>' +
    '<button class="go" data-act="save" data-p="' + p + '">넣기</button>' +
    '<button data-act="nomatch" data-p="' + p + '">비교군 없음</button>' +
    (MINE[p] ? '<button class="off" data-act="unset" data-p="' + p +
               '">넣은 값 지우기</button>' : ""));
  setTimeout(() => { const el = $("#pin"); if (el) el.focus(); }, 60);
}

/* 카톡·인스타 같은 앱 안의 브라우저는 저장하는 곳이 따로다. 거기서 넣은 값은
   크롬을 열면 하나도 안 보인다. 모르고 하루치를 날리지 않도록 막아 준다. */
const UA = navigator.userAgent;
const IN_APP = /KAKAOTALK|Instagram|FBAN|FBAV|NAVER\(inapp|Line\/|DaumApps|;wv\)/i.test(UA);
const IOS = /iPhone|iPad|iPod/i.test(UA);

/* 안드로이드는 `intent://` 로 원하는 브라우저를 지목해 띄울 수 있다.
   주소에 붙은 `#검색어` 는 떼어내야 한다. intent 주소도 # 로 옵션을 붙이는
   문법이라, 그대로 두면 서로 엉켜 열리지 않는다. */
function openIn(pkg){
  const bare = location.href.split("#")[0].replace(/^https?:\/\//, "");
  location.href = "intent://" + bare +
      "#Intent;scheme=https;package=" + pkg + ";end";
}
const BROWSERS = IOS
  ? [["사파리에서 열기", null]]        // 아이폰은 웹에서 사파리를 지목할 수 없다
  : [["크롬으로 열기", "com.android.chrome"],
     ["삼성 인터넷으로 열기", "com.sec.android.app.sbrowser"]];

if (IN_APP){
  if (/Instagram|FBAN|FBAV/i.test(UA)) $("#inapptitle").textContent =
      "앱 안의 브라우저에서는 쓰지 마세요";
  $("#inappbtns").innerHTML = BROWSERS.map((b, i) =>
      '<button data-pkg="' + (b[1] || "") + '">' + b[0] + "</button>").join("") +
      '<button data-pkg="copy">주소 복사</button>';
  $("#inapp").style.display = "block";
}
$("#inappbtns").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const pkg = b.dataset.pkg;
  if (pkg && pkg !== "copy") return openIn(pkg);
  // 아이폰이거나 주소 복사 — 사파리는 손으로 붙여 넣는 수밖에 없다
  try { navigator.clipboard.writeText(location.href.split("#")[0]); } catch(err){}
  b.textContent = "주소를 복사했습니다";
  $("#inapp").insertAdjacentHTML("beforeend",
      '<span class="tip">복사한 주소를 ' +
      (IOS ? "사파리" : "브라우저") + ' 주소창에 붙여 넣으세요.</span>');
});

$("#cartbtn").insertAdjacentHTML("afterbegin", HEART);
$("#cartbtn").addEventListener("click", openCart);
$("#cartbar").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const mine = $("#cartbar").dataset.mode === "mine";
  if (b.dataset.act === "clear"){
    if (mine){ MINE = {}; saveMine(); }
    else { CART = []; saveCart(); }
    return run();
  }
  const text = mine ? mineText() : VIEW.map(i => i.name).join("\n");
  try { navigator.clipboard.writeText(text); } catch(e){}
  const was = b.textContent;
  b.textContent = "복사했습니다";
  setTimeout(() => { b.textContent = was; }, 1500);
});
saveCart();

/* ========================= 목록에서 누를 때 ========================= */
/* 카드를 길게 누르면 곧장 값 넣는 자리로 간다.
   훑으면서 넣을 때 메뉴를 한 번 거치지 않아도 된다.
   아이콘 위에서는 안 되게 한다 — 거기는 저마다 할 일이 있다.
   손가락이 10px 넘게 움직이면 목록을 넘기려는 것이므로 그만둔다. */
const LP = {t: 0, x: 0, y: 0, fired: false};
$("#list").addEventListener("pointerdown", e => {
  clearTimeout(LP.t);
  LP.fired = false;
  const card = e.target.closest(".item");
  if (!card || e.target.closest(".cpg,.cart,.thumb,.goc")) return;
  const p = card.dataset.p;
  LP.x = e.clientX; LP.y = e.clientY;
  LP.t = setTimeout(() => { LP.fired = true; openPrice(p); }, 500);
});
$("#list").addEventListener("pointermove", e => {
  if (Math.abs(e.clientX - LP.x) > 10 || Math.abs(e.clientY - LP.y) > 10)
    clearTimeout(LP.t);
});
["pointerup", "pointercancel", "pointerleave"].forEach(
    t => $("#list").addEventListener(t, () => clearTimeout(LP.t)));
addEventListener("scroll", () => clearTimeout(LP.t), {passive: true});

$("#list").addEventListener("click", e => {
  if (LP.fired){ LP.fired = false; return; }   // 길게 누른 뒤 따라오는 누름
  const card = e.target.closest(".item"); if (!card) return;
  const p = card.dataset.p;
  const it = DATA.find(x => x.p === p); if (!it) return;

  if (e.target.closest(".cpg")) return coupang(it.name, it.a);
  const cartIcon = e.target.closest(".cart");
  if (cartIcon){
    if (inCart(p)) CART = CART.filter(x => x !== p);
    else CART.push(p);
    saveCart();
    // 찜한 것 보기에서는 줄이 빠져야 하니 다시 그리고, 아니면 하트만 바꾼다
    if ($("#view").value === "cart") return run();
    cartIcon.classList.toggle("on", inCart(p));
    return;
  }
  if (e.target.closest(".goc")) return coupang(it.name, it.a);
  const img = e.target.closest(".thumb");
  if (img){
    $("#zoom img").src = img.src || "";
    $("#zoom p").textContent = it.name;
    $("#zoom").style.display = "flex";
    markOverlay();
    showBig(p);
    return;
  }
  // 상품명 쪽을 누르면 무엇을 할지 고르게 한다
  // 이미 한 일인지 아닌지가 글자와 그림에 같이 드러나야 헷갈리지 않는다.
  const on = inCart(p);
  openSheet("<h3>" + esc(it.name) + "</h3>" +
    '<p class="note">군마트 ' + won(it.g) +
      (it.c != null ? " · " + CP + " " + won(it.c) : "") + "</p>" +
    '<button class="go" data-act="coupang" data-p="' + p + '" data-q="' +
      esc(it.name) + '"><i class="ico cpg-img"></i>' + CP + " 가격 확인하기</button>" +
    '<button data-act="' + (on ? "del" : "add") + '" data-p="' + p + '">' +
      '<i class="ico' + (on ? " on" : "") + '">' + HEART + "</i>" +
      (on ? "찜하기 취소" : "찜하기") + "</button>" +
    '<button data-act="price" data-p="' + p + '"><i class="ico won">₩</i>' +
      (it.mine ? CP + " 가격비교 수정하기" : CP + " 가격비교 입력하기") + "</button>");
});
$("#zoom").addEventListener("click", dismiss);
</script>
</body>
</html>
